<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Items</h1>

    <form id="add-form">
      <label for="item-input" class="sr-only">New item</label>
      <input
        id="item-input"
        type="text"
        name="name"
        placeholder="Add a new item..."
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <p id="error-msg" class="error" hidden></p>

    <ul id="item-list"></ul>

    <p id="empty-msg" class="empty">No items yet.</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
