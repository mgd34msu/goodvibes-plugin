  - name: frontend-engine
    count: 14
    tools:
      - name: frontend_component_tree
        path: frontend-engine/frontend-component-tree.yaml
        description: >-
          Parse JSX/TSX files and build a component hierarchy tree. Uses static AST analysis to find component
          definitions and usages, extract props, and build parent-child relationships. Useful for understanding React
          component architecture.
      - name: frontend_stacking_context
        path: frontend-engine/frontend-stacking-context.yaml
        description: >-
          Analyze z-index and stacking contexts in React components. Detects which CSS properties create new stacking
          contexts (position+z-index, transform, opacity, filter, isolation, etc.), builds a hierarchical stacking tree,
          identifies potential z-index conflicts, and finds portal destinations. Essential for debugging "why isn't my
          z-index working" issues.
      - name: frontend_responsive_breakpoints
        path: frontend-engine/frontend-responsive-breakpoints.yaml
        description: >-
          Analyze responsive Tailwind classes across breakpoints. Detects mobile-first patterns, tracks property changes
          across breakpoints (sm, md, lg, xl, 2xl), identifies breakpoint coverage gaps, and flags potential responsive
          design issues like desktop-first patterns or missing base styles. Supports custom breakpoints via explicit
          parameter or automatic tailwind.config.js/ts detection.
      - name: frontend_component_state
        path: frontend-engine/frontend-component-state.yaml
        description: >-
          Trace React state and props through component trees. Analyzes useState, useReducer, useRef, useContext, and
          effect hooks. Detects prop drilling, callback instability, missing memoization, and other common React
          anti-patterns. Returns detailed state flow analysis including which state is used in JSX and passed to
          children.
      - name: frontend_render_triggers
        path: frontend-engine/frontend-render-triggers.yaml
        description: >-
          Analyze what causes a React component to re-render. Identifies memoization status (React.memo, PureComponent,
          shouldComponentUpdate), inline definitions creating unstable references (objects, arrays, functions, JSX),
          expensive computations not wrapped in useMemo, context subscriptions and their granularity, and provides
          prioritized optimization suggestions.
      - name: frontend_layout_hierarchy
        path: frontend-engine/frontend-layout-hierarchy.yaml
        description: >-
          Analyze the CSS layout hierarchy of React components. Parses JSX/TSX files to build a layout tree with sizing
          constraints, display types (flex/grid/block), flex/grid properties, overflow handling, and positioning.
          Supports comprehensive Tailwind CSS class parsing. Detects potential layout issues like fixed height
          containers with auto-height children, nested flex without sizing, percentage height without parent height,
          etc.
      - name: frontend_overflow
        path: frontend-engine/frontend-overflow.yaml
        description: >-
          Diagnose CSS overflow issues and recommend fixes. Analyzes layout hierarchy to identify overflow-prone
          patterns such as fixed-height containers with auto-height children, flex containers without overflow handling,
          nested percentage heights, absolute positioning without containment, and missing min-h-0 in nested flex.
          Returns actionable fix options with Tailwind CSS classes and trade-off explanations.
      - name: frontend_accessibility_tree
        path: frontend-engine/frontend-accessibility-tree.yaml
        description: >-
          Build an accessibility tree and detect WCAG issues in React components. Analyzes semantic HTML roles, focus
          order, keyboard interactions, and ARIA patterns. Detects issues like missing alt text (1.1.1), unlabeled form
          inputs (1.3.1), buttons/links without accessible names (4.1.2), click handlers on non-interactive elements,
          missing focus indicators (2.4.7), and invalid ARIA patterns. Returns a hierarchical accessibility tree, focus
          order sequence, issues with WCAG criteria references, and optimization suggestions.
      - name: frontend_sizing_strategy
        path: frontend-engine/frontend-sizing-strategy.yaml
        description: >-
          Analyze how a specific element's size is determined. Examines Tailwind classes or CSS to identify width/height
          strategies (fixed, percentage, viewport, content-based, flex-controlled, grid-controlled), min/max
          constraints, flex behavior (grow, shrink, basis), grid placement, overflow settings, and positioning context.
          Walks the ancestor chain to find constraints that affect the target element. Returns a human-readable summary
          explaining how the element's dimensions are computed.
      - name: frontend_event_flow
        path: frontend-engine/frontend-event-flow.yaml
        description: >-
          Analyze event handling and propagation in React components. Detects all event handlers (onClick, onChange,
          onSubmit, etc.), simulates event bubbling from leaf to root, identifies issues like nested clickable elements
          that may double-fire, click handlers on non-interactive elements without keyboard alternatives, and form
          submits without preventDefault. Also detects event delegation patterns (e.target.closest, e.target.matches
          checks). Essential for debugging "why is my click firing twice" and accessibility audits.
      - name: frontend_hook_dependencies
        path: frontend-engine/frontend-hook-dependencies.yaml
        description: >-
          Analyzes React hook dependency arrays for stale closures, missing/unnecessary dependencies, unstable
          references, and anti-patterns like derived state in effects. Covers useEffect, useMemo, useCallback,
          useLayoutEffect, useInsertionEffect. Detects: stale closures (empty deps + state refs), missing deps (body
          refs not in array), unnecessary deps (array entries not referenced), unstable deps (inline
          objects/arrays/functions, .map()/.filter() results, Object.keys/values/entries), derived state anti-pattern,
          and missing cleanup for subscriptions/timers.
      - name: frontend_tailwind_conflicts
        path: frontend-engine/frontend-tailwind-conflicts.yaml
        description: >-
          Detect conflicting and redundant Tailwind CSS classes in React components. Identifies three types of issues:
          (1) Override conflicts where later classes override earlier ones (e.g., "p-2 p-4"), (2) Redundant classes from
          shorthand/longhand combinations (e.g., "p-2 px-4" where p-2's x-padding is overridden), (3) Contradiction
          conflicts with mutually exclusive classes (e.g., "hidden flex"). Also detects size-X conflicts with explicit
          w-/h- classes, z-index without position, and provides optimization suggestions like using size-X instead of
          w-X h-X when equal.
      - name: frontend_client_boundary
        path: frontend-engine/frontend-client-boundary.yaml
        description: >-
          Analyzes Next.js App Router "use client" and "use server" boundaries to find misclassified components,
          unnecessary client components, and boundary optimization opportunities. Scans files for directives, builds an
          import graph, classifies each file as server/client/client-inherited/ambiguous, and detects issues like
          missing directives, unnecessary client usage, server-only imports in client files, and large client subtrees
          that bloat the bundle.
      - name: frontend_error_boundaries
        path: frontend-engine/frontend-error-boundaries.yaml
        description: >-
          Analyzes React/Next.js projects for error boundary coverage. Detects class-based error boundaries
          (getDerivedStateFromError / componentDidCatch) and library wrappers (react-error-boundary, Sentry, etc.),
          analyzes which component subtrees are protected, identifies missing error.tsx files in Next.js App Router
          route segments, and flags issues like missing fallback UI, missing reset/retry mechanisms, overly broad
          boundaries, and async components without protection.
