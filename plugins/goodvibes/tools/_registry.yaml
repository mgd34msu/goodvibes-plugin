      - name: precision_exec
        path: precision-engine/precision-exec.yaml
        description: >-
          Execute shell commands with batch support, timeout, and expectations checking. ' + 'Captures stdout, stderr,
          and exit code. ' + 'Supports file_ops (copy, move, delete) that execute BEFORE commands.
      - name: precision_fetch
        path: precision-engine/precision-fetch.yaml
        description: >-
          Fetch URLs with native fetch. Service registry integration for named APIs with auto-auth. ' + 'Supports batch
          fetching, extraction modes
          (raw/text/json/markdown/structured/summary/code_blocks/tables/links/metadata/readable/pdf), ' + 'custom
          headers, method override, timeout, and content type detection.
      - name: discover
        path: precision-engine/discover.yaml
        description: >-
          Execute multiple grep, glob, symbol, or index queries in parallel. ' + 'Returns results keyed by query ID for
          efficient batch discovery.
      - name: precision_grep
        path: precision-engine/precision-grep.yaml
        description: >-
          Search for patterns with batch queries and precise output control. ' + 'Supports count_only, files_only,
          locations, matches, and context modes.
      - name: precision_read
        path: precision-engine/precision-read.yaml
        description: >-
          Token-efficient file reading with extraction formats. ' + 'Read full content, outlines, symbols, or specific
          line ranges. ' + 'Supports per-file range overrides and symbol filtering. ' + 'Image files (.png, .jpg, .gif,
          .webp, .svg, etc.) are returned as visual content blocks. ' + 'PDF files support page-based reading. ' +
          'Jupyter notebooks (.ipynb) return structured cell output.
      - name: precision_glob
        path: precision-engine/precision-glob.yaml
        description: >-
          Token-efficient file finding with filters and optional preview. ' + 'Supports size/date filters, content
          matching, sorting, and gitignore.
      - name: precision_symbols
        path: precision-engine/precision-symbols.yaml
        description: >-
          Token-efficient symbol search across workspace or specific files. ' + 'Supports workspace-wide symbol search
          and per-file symbol extraction.
      - name: precision_notebook
        path: precision-engine/precision-notebook.yaml
        description: >-
          Edit Jupyter notebook (.ipynb) cells with batch operations. ' + 'Supports replace, insert, and delete with
          index or cell_id targeting and automatic index adjustment.
      - name: precision_config
        path: precision-engine/precision-config.yaml
        description: |
          Get or set precision-engine runtime configuration.
          Supports toggling sandbox mode (path boundary enforcement) and other settings.
          Also provides telemetry queries, per-session state, hook management, and output mode switching.
      - name: precision_edit
        path: precision-engine/precision-edit.yaml
        description: >-
          Token-efficient file editing with atomic transactions, ' + 'conflict detection, and validation. Supports
          exact, fuzzy, regex, and AST matching formats.
      - name: precision_agent
        path: precision-engine/precision-agent.yaml
        description: >-
          Spawn a headless AI session across multiple providers (Claude, Gemini, Codex). ' + 'Always runs in background
