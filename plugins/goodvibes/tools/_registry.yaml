  - name: frontend-engine
    count: 11
    tools:
      - name: get_react_component_tree
        path: frontend-engine/get-react-component-tree.yaml
        description: >-
          Parse JSX/TSX files and build a component hierarchy tree. Uses static AST analysis to find component
          definitions and usages, extract props, and build parent-child relationships. Useful for understanding React
          component architecture.
      - name: analyze_stacking_context
        path: frontend-engine/analyze-stacking-context.yaml
        description: >-
          Analyze z-index and stacking contexts in React/Vue/Svelte components. Detects which CSS properties create new
          stacking contexts (position+z-index, transform, opacity, filter, isolation, etc.), builds a hierarchical
          stacking tree, identifies potential z-index conflicts, and finds portal destinations. Essential for debugging
          "why isn't my z-index working" issues.
      - name: analyze_responsive_breakpoints
        path: frontend-engine/analyze-responsive-breakpoints.yaml
        description: >-
          Analyze responsive Tailwind classes across breakpoints. Detects mobile-first patterns, tracks property changes
          across breakpoints (sm, md, lg, xl, 2xl), identifies breakpoint coverage gaps, and flags potential responsive
          design issues like desktop-first patterns or missing base styles.
      - name: trace_component_state
        path: frontend-engine/trace-component-state.yaml
        description: >-
          Trace React state and props through component trees. Analyzes useState, useReducer, useRef, useContext, and
          effect hooks. Detects prop drilling, callback instability, missing memoization, and other common React
          anti-patterns. Returns detailed state flow analysis including which state is used in JSX and passed to
          children.
      - name: analyze_render_triggers
        path: frontend-engine/analyze-render-triggers.yaml
        description: >-
          Analyze what causes a React component to re-render. Identifies memoization status (React.memo, PureComponent,
          shouldComponentUpdate), inline definitions creating unstable references (objects, arrays, functions, JSX),
          expensive computations not wrapped in useMemo, context subscriptions and their granularity, and provides
          prioritized optimization suggestions.
      - name: analyze_layout_hierarchy
        path: frontend-engine/analyze-layout-hierarchy.yaml
        description: >-
          Analyze the CSS layout hierarchy of React/Vue/Svelte components. Parses JSX/TSX files to build a layout tree
          with sizing constraints, display types (flex/grid/block), flex/grid properties, overflow handling, and
          positioning. Supports comprehensive Tailwind CSS class parsing. Detects potential layout issues like fixed
          height containers with auto-height children, nested flex without sizing, percentage height without parent
          height, etc.
      - name: diagnose_overflow
        path: frontend-engine/diagnose-overflow.yaml
        description: >-
          Diagnose CSS overflow issues and recommend fixes. Analyzes layout hierarchy to identify overflow-prone
          patterns such as fixed-height containers with auto-height children, flex containers without overflow handling,
          nested percentage heights, absolute positioning without containment, and missing min-h-0 in nested flex.
          Returns actionable fix options with Tailwind CSS classes and trade-off explanations.
      - name: get_accessibility_tree
        path: frontend-engine/get-accessibility-tree.yaml
        description: >-
          Build an accessibility tree and detect WCAG issues in React/Vue/Svelte components. Analyzes semantic HTML
          roles, focus order, keyboard interactions, and ARIA patterns. Detects issues like missing alt text (1.1.1),
          unlabeled form inputs (1.3.1), buttons/links without accessible names (4.1.2), click handlers on
          non-interactive elements, missing focus indicators (2.4.7), and invalid ARIA patterns. Returns a hierarchical
          accessibility tree, focus order sequence, issues with WCAG criteria references, and optimization suggestions.
      - name: get_sizing_strategy
        path: frontend-engine/get-sizing-strategy.yaml
        description: >-
          Analyze how a specific element's size is determined. Examines Tailwind classes or CSS to identify width/height
          strategies (fixed, percentage, viewport, content-based, flex-controlled, grid-controlled), min/max
          constraints, flex behavior (grow, shrink, basis), grid placement, overflow settings, and positioning context.
          Walks the ancestor chain to find constraints that affect the target element. Returns a human-readable summary
          explaining how the element's dimensions are computed.
      - name: analyze_event_flow
        path: frontend-engine/analyze-event-flow.yaml
        description: >-
          Analyze event handling and propagation in React/Vue/Svelte components. Detects all event handlers (onClick,
          onChange, onSubmit, etc.), simulates event bubbling from leaf to root, identifies issues like nested clickable
          elements that may double-fire, click handlers on non-interactive elements without keyboard alternatives, and
          form submits without preventDefault. Also detects event delegation patterns (e.target.closest,
          e.target.matches checks). Essential for debugging "why is my click firing twice" and accessibility audits.
      - name: analyze_tailwind_conflicts
        path: frontend-engine/analyze-tailwind-conflicts.yaml
        description: >-
          Detect conflicting and redundant Tailwind CSS classes in React/Vue/Svelte components. Identifies three types
          of issues: (1) Override conflicts where later classes override earlier ones (e.g., "p-2 p-4"), (2) Redundant
          classes from shorthand/longhand combinations (e.g., "p-2 px-4" where p-2's x-padding is overridden), (3)
          Contradiction conflicts with mutually exclusive classes (e.g., "hidden flex"). Also detects size-X conflicts
          with explicit w-/h- classes, z-index without position, and provides optimization suggestions like using size-X
          instead of w-X h-X when equal.
