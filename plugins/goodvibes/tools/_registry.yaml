core_tools:
  - name: list_templates
    path: definitions/project-engine/list-templates.yaml
    description: |
      List available project templates with their descriptions,
      tech stacks, and complexity levels. Filter by category.
  - name: plugin_status
    path: definitions/project-engine/plugin-status.yaml
    description: |
      Check GoodVibes plugin health status.
      Verifies manifest, registries, hooks config, and script files.
      Returns issues and overall health status.
  - name: project_issues
    path: definitions/project-engine/project-issues.yaml
    description: |
      Get detailed project issues: high-priority TODOs with file:line,
      health warnings, environment issues.
      Scans the codebase for actionable issues and returns them
      in a structured format with locations and severity levels.
deferred_tools:
  - name: identify_tech_debt
    path: definitions/analysis-engine/identify-tech-debt.yaml
    description: >-
      Identify and grade technical debt in the codebase. Scans for TODO/FIXME/HACK comments, complex functions (high
      cyclomatic complexity), long files, missing tests, outdated dependencies, and code smells. Returns prioritized
      debt items with effort estimates.
  - name: analyze_bundle
    path: definitions/project-engine/analyze-bundle.yaml
    description: >-
      Analyze bundle size, duplicates, and tree-shaking issues in build output. Scans dist/, .next/, or build/
      directories for bundle files and reports total size, chunk breakdown, largest modules, duplicate dependencies, and
      optimization recommendations.
  - name: detect_stack
    path: definitions/analysis-engine/detect-stack.yaml
    description: |
      Analyze project to identify the technology stack. Scans package.json,
      config files, and directory structure to determine frameworks, libraries,
      and tools in use. Essential for selecting appropriate skills.
  - name: check_versions
    path: definitions/analysis-engine/check-versions.yaml
    description: |
      Get installed package versions and compare against skill assumptions.
      Identifies version mismatches that could cause skill advice to fail.
      Checks both direct dependencies and peer dependencies.
  - name: scan_patterns
    path: definitions/analysis-engine/scan-patterns.yaml
    description: |
      Identify existing code patterns and conventions in the project.
      Helps apply skills consistently with established patterns.
      Detects naming conventions, file structure, and architectural patterns.
  - name: read_config
    path: definitions/analysis-engine/read-config.yaml
    description: |
      Parse and return existing configuration files.
      Understands various config formats (JSON, YAML, JS, TS).
      Skills can build upon existing configuration.
  - name: get_conventions
    path: definitions/analysis-engine/get-conventions.yaml
    description: >-
      LLM-powered analysis of code patterns and conventions in a project. Samples files from different parts of the
      codebase, analyzes naming conventions, import patterns, file structure, testing patterns, and error handling. Uses
      Claude to synthesize findings into actionable convention guidelines.
  - name: analyze_dependencies
    path: definitions/project-engine/analyze-dependencies.yaml
    description: >-
      Analyze npm dependencies to find unused, missing, and outdated packages. Compares declared dependencies in
      package.json against actual imports in source files.
  - name: find_circular_deps
    path: definitions/analysis-engine/find-circular-deps.yaml
    description: >-
      Detect circular import dependencies in the codebase. Builds an import graph by parsing all source files and uses
      DFS to detect cycles. Returns all cycles found with the full file paths involved.
  - name: parse_error_stack
    path: definitions/analysis-engine/parse-error-stack.yaml
    description: |
      Parse error stack traces and provide structured analysis.
      Extracts file paths, line numbers, and function names from stack traces.
      Maps frames to project files and identifies the root cause frame.
      Useful for debugging runtime errors and understanding error origins.
  - name: explain_type_error
    path: definitions/analysis-engine/explain-type-error.yaml
    description: >-
      Explain TypeScript error codes in human-friendly terms with fix suggestions. Takes an error code and message,
      returns detailed explanation, common causes, and actionable fix suggestions.
  - name: resolve_merge_conflict
    path: definitions/project-engine/resolve-merge-conflict.yaml
    description: >-
      Analyze and suggest resolutions for git merge conflicts. Parses conflict markers, analyzes both versions, and
      recommends resolution strategy (ours, theirs, or combined). Can auto-resolve simple conflicts.
  - name: find_dead_code
    path: definitions/analysis-engine/find-dead-code.yaml
    description: >-
      Find unused exports and functions in a file or directory. Uses TypeScript Language Service to identify exports
      that have no external references. Useful for identifying dead code that can be safely removed.
  - name: get_api_surface
    path: definitions/analysis-engine/get-api-surface.yaml
    description: >-
      Analyze the public vs internal API surface of a module or package. Identifies exports from entry points (index.ts,
      package.json main) as public API, and other exports as internal. Includes type information for each export.
  - name: safe_delete_check
    path: definitions/analysis-engine/safe-delete-check.yaml
    description: >-
      Confirm a symbol has zero external usages before deleting. Provides a cleaner interface than find_references with
      a clear yes/no answer. Handles edge cases like self-references and same-declaration references.
  - name: detect_breaking_changes
    path: definitions/analysis-engine/detect-breaking-changes.yaml
    description: >-
      LLM-powered tool to detect breaking API changes between git refs. Compares type signatures before/after and uses
      Claude to identify: function signature changes, interface/type property changes, exported symbol removals, and
      visibility changes. Returns breaking and non-breaking changes with migration guidance.
  - name: semantic_diff
    path: definitions/analysis-engine/semantic-diff.yaml
    description: >-
      LLM-powered type-aware diff with semantic impact explanation. Goes beyond text-based diff to understand what
      semantically changed, impact on type safety and API contracts, which callers might be affected, and risk level of
      each change. Uses Claude for deep analysis.
  - name: scaffold_project
    path: definitions/project-engine/scaffold-project.yaml
    description: |
      Create a new project from a template. Copies template files,
      applies variable substitutions, and runs post-create commands.
      Lists recommended skills based on the template stack.
  - name: generate_openapi
    path: definitions/project-engine/generate-openapi.yaml
    description: >-
      Generate OpenAPI 3.0.3 specification from detected API routes. Supports Next.js (App Router & Pages Router),
      Express, Fastify, and Hono. Extracts path parameters, attempts to parse request/response types from handlers, and
      generates examples.
  - name: get_database_schema
    path: definitions/project-engine/get-database-schema.yaml
    description: >-
      Auto-detect and extract database schema from project files. Checks for Prisma, Drizzle, and SQL schema files.
      Returns unified schema with tables, columns, indexes, and relations.
  - name: get_api_routes
    path: definitions/project-engine/get-api-routes.yaml
    description: >-
      Extract API routes from web frameworks. Supports Next.js (App Router & Pages Router), Express, Fastify, and Hono.
      Returns HTTP method, path, handler location, and middleware information.
  - name: get_prisma_operations
    path: definitions/project-engine/get-prisma-operations.yaml
    description: >-
      Find all Prisma client usages in the codebase and detect N+1 query patterns. Scans for prisma.model.operation()
      calls, identifies which models are used most, and detects queries inside loops that may cause performance issues.
  - name: query_database
    path: definitions/project-engine/query-database.yaml
    description: >-
      Execute SQL queries against PostgreSQL, MySQL, or SQLite databases. Supports readonly mode (default) to prevent
      accidental writes, auto-LIMIT for SELECT queries, EXPLAIN output, and both JSON and table output formats. For
      SQLite: supports parameterized queries (?), in-memory databases (:memory:), connection pooling, and returns
      affected row count for write operations. Database drivers (pg, mysql2, better-sqlite3) are optional - install only
      the ones you need.
  - name: upgrade_package
    path: definitions/project-engine/upgrade-package.yaml
    description: >-
      Upgrade an npm package with comprehensive breaking change detection. Analyzes changelog for breaking changes,
      checks which packages depend on this one, and optionally runs tests after upgrade. Supports dry run mode for safe
      preview before making changes.
  - name: explain_codebase
    path: definitions/project-engine/explain-codebase.yaml
    description: >-
      Generate a high-level explanation of a codebase using LLM analysis. Gathers information from stack detection, API
      routes, conventions, and directory structure to produce a comprehensive overview including architecture diagrams,
      key files, entry points, and potential concerns.
  - name: scan_for_secrets
    path: definitions/analysis-engine/scan-for-secrets.yaml
    description: >-
      Scan source files for potential secrets, credentials, and sensitive data. Detects common secret patterns including
      API keys, tokens, passwords, private keys, and database connection strings. Supports configurable depth limit and
      early exit for presence-only checks.
  - name: check_permissions
    path: definitions/analysis-engine/check-permissions.yaml
    description: |
      Analyze file, network, and system access patterns in code.
      Scans for potentially sensitive API usage including:
      - Filesystem access (fs, path operations)
      - Network requests (http, https, fetch, axios)
      - Process spawning (child_process, exec, spawn)
      - Cryptographic operations (crypto)
      Categorizes findings by risk level and provides recommendations.
  - name: find_tests_for_file
    path: definitions/project-engine/find-tests-for-file.yaml
    description: >-
      Find test files that cover a given source file. Analyzes test file naming patterns and import graphs to find
      related tests. Returns a ranked list of test files with confidence scores.
  - name: get_test_coverage
    path: definitions/project-engine/get-test-coverage.yaml
    description: >-
      Parse test coverage reports and map coverage data to functions. Finds coverage files (lcov.info,
      coverage-final.json, etc.) and extracts line, branch, function, and statement coverage percentages. Returns
      uncovered lines and functions for targeted test writing.
  - name: suggest_test_cases
    path: definitions/project-engine/suggest-test-cases.yaml
    description: >-
      Analyze a function and suggest comprehensive test cases. Uses LLM-powered analysis to identify edge cases, error
      conditions, boundary values, and happy path scenarios. Finds existing tests for context and suggests new test
      cases with rationale.
  - name: generate_types
    path: definitions/project-engine/generate-types.yaml
    description: >-
      Generate TypeScript types from various sources: JSON data, API responses, database schemas, or runtime values.
      Infers types from sample data and generates .d.ts or interface definitions.
  - name: generate_fixture
    path: definitions/project-engine/generate-fixture.yaml
    description: >-
      Generate test fixtures from Prisma/TypeScript schemas with smart data generation. Supports optional
      @faker-js/faker integration for realistic data. Can generate multiple output formats including JSON, TypeScript
      constants, and Prisma seed scripts.
  - name: sync_api_types
    path: definitions/project-engine/sync-api-types.yaml
    description: >-
      Detect type drift between backend API routes and frontend API calls. Compares types defined in backend route
      handlers with types used in frontend fetch/axios calls to identify mismatches, missing types, and endpoints that
      don't exist.
  - name: validate_implementation
    path: definitions/analysis-engine/validate-implementation.yaml
    description: |
      Check that generated code matches skill patterns and best practices.
      Validates structure, naming, error handling, and security.
      Run after skill application to ensure quality.
  - name: validate_edits_preview
    path: definitions/analysis-engine/validate-edits-preview.yaml
    description: >-
      Preview the impact of proposed edits before applying them. Creates a virtual snapshot with edits applied and runs
      TypeScript diagnostics to detect any new errors that would be introduced. Does NOT modify any files - purely a
      validation/preview operation. Useful for fail-fast validation before writing code.
  - name: validate_api_contract
    path: definitions/analysis-engine/validate-api-contract.yaml
    description: >-
      Validate API responses against OpenAPI spec. Makes requests to each endpoint and verifies response status codes
      and body schemas match the spec. Reports violations with JSON paths.
