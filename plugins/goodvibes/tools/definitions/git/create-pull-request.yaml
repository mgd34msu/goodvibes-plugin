name: create_pull_request
version: "1.0.0"
description: |
  Create a GitHub pull request with auto-generated descriptions.
  Analyzes git changes, generates title and description using LLM,
  pushes branch if needed, and creates PR via gh CLI.
  Supports draft PRs, labels, and reviewer assignment.

category: git
tags:
  - github
  - pull-request
  - git
  - automation
  - llm

mcp:
  server: goodvibes-tools
  method: create_pull_request
  defer_loading: true

inputSchema:
  type: object
  properties:
    base:
      type: string
      description: "Base branch for the PR (default: auto-detect, usually \"main\")"
    title:
      type: string
      description: PR title (auto-generated from branch name or commits if not provided)
    body:
      type: string
      description: PR body/description (auto-generated using LLM if not provided)
    draft:
      type: boolean
      description: Create as draft PR
      default: false
    labels:
      type: array
      items:
        type: string
      description: "Labels to add to the PR (e.g., [\"bug\", \"enhancement\"])"
    reviewers:
      type: array
      items:
        type: string
      description: GitHub usernames to request as reviewers
    auto_description:
      type: boolean
      description: Use LLM to generate PR description
      default: true

handler:
  type: native
  module: git
  function: handleCreatePullRequest
