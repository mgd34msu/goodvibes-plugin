name: auto_rollback
version: "1.0.0"
description: |
  Automatically rollback changes when conditions are met.
  Monitors for triggers (build failure, test failure, error patterns)
  and reverts to last known good state using git.

category: git
tags:
  - git
  - rollback
  - revert
  - automation
  - safety

mcp:
  server: goodvibes-tools
  method: auto_rollback
  defer_loading: true

inputSchema:
  type: object
  properties:
    trigger:
      type: string
      enum: [build_fail, test_fail, error_pattern, manual]
      description: Condition that triggers rollback
    scope:
      type: string
      enum: [file, commit, branch]
      description: "Rollback scope: single file, last commit, or entire branch"
      default: commit
    files:
      type: array
      items:
        type: string
      description: Specific files to rollback (for file scope)
    to_ref:
      type: string
      description: "Git ref to rollback to (default: HEAD~1)"
    dry_run:
      type: boolean
      description: Preview rollback without applying
      default: false
  required:
    - trigger

handler:
  type: native
  module: git
  function: handleAutoRollback
