name: analyze_render_triggers
version: "1.0.0"
description: |
  Analyze what causes a React component to re-render.
  Identifies memoization status (React.memo, PureComponent, shouldComponentUpdate),
  inline definitions creating unstable references (objects, arrays, functions, JSX),
  expensive computations not wrapped in useMemo, context subscriptions and their
  granularity, and provides prioritized optimization suggestions.

category: frontend
tags:
  - react
  - performance
  - rendering
  - memoization
  - optimization
  - debugging

mcp:
  server: goodvibes-tools
  method: analyze_render_triggers
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: Path to the React component file to analyze (relative to project root or absolute)
    include_children:
      type: boolean
      description: Analyze child component memoization and prop stability
      default: false
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleAnalyzeRenderTriggers
