name: diagnose_overflow
version: "1.0.0"
description: |
  Diagnose CSS overflow issues and recommend fixes.
  Analyzes layout hierarchy to identify overflow-prone patterns such as
  fixed-height containers with auto-height children, flex containers without
  overflow handling, nested percentage heights, absolute positioning without
  containment, and missing min-h-0 in nested flex. Returns actionable fix
  options with Tailwind CSS classes and trade-off explanations.

category: frontend
tags:
  - css
  - overflow
  - layout
  - tailwind
  - debugging
  - scrolling

mcp:
  server: goodvibes-tools
  method: diagnose_overflow
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: Component file path to analyze (relative to project root or absolute). Supports .tsx and .jsx files.
    problem_description:
      type: string
      description: "Optional: Description of the overflow problem (e.g., \"content overflowing container\", \"scroll not working\"). Helps contextualize the diagnosis."
    element_hint:
      type: string
      description: "Optional: Class name or selector to focus analysis on. Builds a constraint chain showing how layout constraints propagate to this element."
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleDiagnoseOverflow
