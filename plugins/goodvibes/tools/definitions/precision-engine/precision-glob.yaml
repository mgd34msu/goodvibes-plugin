name: precision_glob
description: |
  Token-efficient file finding with filters and optional preview.
  Supports size/date filters, content matching, sorting, and gitignore.
inputSchema:
  type: object
  properties:
    patterns:
      type: array
      items:
        type: string
      description: Glob patterns to match
    patterns_base64:
      type: array
      items:
        type: string
      description: Base64-encoded glob patterns. REQUIRED when patterns contain single quotes, backticks, or ${} patterns. Encode each with echo -n "pattern" | base64 -w0. Note Brackets [ ] are auto-escaped for literal matching.
    preset:
      type: string
      enum: [typescript, javascript, styles, config, tests, all]
      description: Predefined pattern preset
    exclude:
      type: array
      items:
        type: string
      description: Patterns to exclude
    filters:
      type: object
      properties:
        min_size:
          type: integer
          minimum: 0
          description: Minimum file size in bytes
        max_size:
          type: integer
          minimum: 0
          description: Maximum file size in bytes
        modified_after:
          type: string
          format: date-time
          description: ISO date - files modified after
        modified_before:
          type: string
          format: date-time
          description: ISO date - files modified before
        has_content:
          type: string
          description: Regex to match in file content
        is_empty:
          type: boolean
          description: Filter for empty files
      description: File filters
    output:
      type: object
      properties:
        format:
          type: string
          enum: [count_only, paths_only, with_stats, with_preview]
          default: paths_only
          description: Output data format (alias for mode)
        max_results:
          type: integer
          minimum: 1
          default: 100
          description: Maximum files to return (alias for max_files)
        max_files:
          type: integer
          minimum: 1
          default: 100
          description: Maximum files to return
        sort_by:
          type: string
          enum: [name, size, modified]
          description: Sort results by field
        sort_order:
          type: string
          enum: [asc, desc]
          default: asc
          description: Sort order
        preview_lines:
          type: integer
          minimum: 1
          default: 3
          description: Lines to preview for with_preview mode
        max_tokens:
          type: integer
          minimum: 1
          description: Hard token cap for output
      description: Output configuration
    respect_gitignore:
      type: boolean
      default: true
      description: Respect .gitignore rules
    follow_symlinks:
      type: boolean
      default: false
      description: Follow symbolic links
    include_hidden:
      type: boolean
      default: true
      description: Include hidden/dot files and directories (e.g. .git, .config)
    backend:
      type: string
      enum: [auto, fast-glob, ripgrep]
      description: |
        Backend implementation:
        - auto: Choose best based on query (default)
        - fast-glob: JavaScript glob implementation
        - ripgrep: Fast CLI tool (better for large repos)
    base_path:
      type: string
      description: Base directory for glob patterns (defaults to process.cwd())
    cwd:
      type: string
      description: 'DEPRECATED: Use base_path instead. Working directory for glob patterns (defaults to process.cwd())'
    verbosity:
      type: string
      enum: [count_only, minimal, standard, verbose]
      default: standard
      description: Response verbosity
  required: []
