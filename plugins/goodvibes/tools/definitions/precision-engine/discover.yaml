name: discover
description: |
  Execute multiple grep, glob, or symbol queries in parallel.
  Returns results keyed by query ID for efficient batch discovery.
inputSchema:
  type: object
  properties:
    queries:
      type: array
      description: Array of queries to execute
      items:
        type: object
        properties:
          id:
            type: string
            description: Unique ID for this query
          type:
            type: string
            enum: [grep, glob, symbols, structural]
            description: Query type (grep=regex, glob=file patterns, symbols=code symbols, structural=AST patterns)
          pattern:
            type: string
            description: Regex pattern (for grep)
          pattern_base64:
            type: string
            description: Base64-encoded regex pattern. REQUIRED when pattern contains single quotes, backticks, or ${} patterns. Encode with echo -n "pattern" | base64 -w0
          glob:
            type: string
            description: File filter (for grep)
          patterns:
            type: array
            items:
              type: string
            description: Glob patterns (for glob)
          patterns_base64:
            type: array
            items:
              type: string
            description: Base64-encoded glob patterns. REQUIRED when patterns contain single quotes, backticks, or ${} patterns. Note Brackets [ ] are auto-escaped for literal matching.
          query:
            type: string
            description: Symbol name (for symbols)
          kinds:
            type: array
            items:
              type: string
            description: Symbol kinds (for symbols)
          structural_pattern:
            type: string
            description: 'AST pattern to search for (e.g., "console.log($$$ARGS)") (for structural queries)'
          structural_pattern_base64:
            type: string
            description: Base64-encoded AST pattern (for structural queries with special chars)
          language:
            type: string
            description: Language for structural pattern matching (default auto)
        required: [id, type]
    verbosity:
      type: string
      enum: [count_only, files_only, locations]
      default: files_only
      description: 'Response verbosity: count_only, files_only (default), or locations'
    base_path:
      type: string
      description: Base directory for searches (default cwd). Must be within project root when sandbox is enabled (default). Use precision_config to allow external paths.
  required: [queries]
