name: precision_edit
description: |
  Token-efficient file editing with atomic transactions, conflict detection, and validation.
  Supports exact, fuzzy, regex, and AST matching modes.
inputSchema:
  type: object
  properties:
    edits:
      type: array
      description: Array of edit operations
      items:
        type: object
        properties:
          id:
            type: string
            description: Edit identifier
          file:
            type: string
            description: File to edit
          find:
            type: string
            description: Text to find
          replace:
            type: string
            description: Replacement text
          occurrence:
            oneOf:
              - type: string
                enum: [first, last, all]
              - type: integer
                minimum: 1
            description: Which occurrence to replace
          hints:
            type: object
            properties:
              near_line:
                type: integer
                description: Line number hint
              in_function:
                type: string
                description: Function name hint
              in_class:
                type: string
                description: Class name hint
              after:
                type: string
                description: Text that comes after
              before:
                type: string
                description: Text that comes before
            description: Location hints
        required: [file, find, replace]
    transaction:
      type: object
      properties:
        mode:
          type: string
          enum: [atomic, partial, none]
          default: atomic
          description: Transaction mode
        rollback_on_fail:
          type: boolean
          default: true
          description: Rollback on failure
      required: [mode]
      description: Transaction configuration
    match:
      type: object
      properties:
        mode:
          type: string
          enum: [exact, fuzzy, regex, ast]
          default: exact
          description: Matching mode
        case_sensitive:
          type: boolean
          default: true
          description: Case sensitive matching
        whitespace_sensitive:
          type: boolean
          default: true
          description: Whitespace sensitive matching
      description: Matching configuration
    validate:
      type: object
      properties:
        before:
          type: array
          items:
            type: string
            enum: [typecheck, lint, test, build]
          description: Validation steps before editing
        after:
          type: array
          items:
            type: string
            enum: [typecheck, lint, test, build]
          description: Validation steps after editing
      description: Validation configuration
    dry_run:
      type: boolean
      default: false
      description: Preview without executing
    output:
      type: object
      properties:
        mode:
          type: string
          enum: [count_only, minimal, with_diff, verbose]
          default: minimal
          description: Output verbosity
        diff_context:
          type: integer
          minimum: 0
          default: 3
          description: Lines of diff context
        max_tokens:
          type: integer
          minimum: 1
          description: Hard token cap
      required: [mode]
      description: Output configuration
  required: [edits]
