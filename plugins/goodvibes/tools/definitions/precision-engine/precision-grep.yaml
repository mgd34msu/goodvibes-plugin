name: precision_grep
description: |
  Search for patterns with batch queries and precise output control.
  Supports count_only, files_only, locations, matches, and context modes.
inputSchema:
  type: object
  properties:
    queries:
      type: array
      description: Array of search queries to execute
      items:
        type: object
        properties:
          id:
            type: string
            description: Query identifier
          pattern:
            type: string
            description: Regex pattern to search for
          pattern_base64:
            type: string
            description: Base64-encoded regex pattern. REQUIRED when pattern contains single quotes, backticks, or ${} patterns. Encode with echo -n "pattern" | base64 -w0
          glob:
            type: string
            description: File pattern to search in
          path:
            type: string
            description: Directory path to search
          exclude:
            type: array
            items:
              type: string
            description: Patterns to exclude
          case_sensitive:
            type: boolean
            description: Case sensitive search (default true)
          whole_word:
            type: boolean
            description: Match whole words only
          multiline:
            type: boolean
            description: Allow multiline matches (default false)
          include_binary:
            type: boolean
            description: Search binary files (default false)
          negate:
            type: boolean
            description: Return files WITHOUT this pattern (negation search)
          include_hidden:
            type: boolean
            default: true
            description: Include hidden/dot files and directories in search (default true)
        required: [id]
    output:
      type: object
      properties:
        format:
          type: string
          enum: [count_only, files_only, locations, matches, context, stats]
          description: Output data format (alias for mode)
        context_before:
          type: integer
          minimum: 0
          description: Lines before match (default 0)
        context_after:
          type: integer
          minimum: 0
          description: Lines after match (default 0)
        expand_to:
          type: string
          enum: [line, block, function, class]
          description: Expand match context to enclosing scope
        max_files:
          type: integer
          minimum: 1
          description: Max files to return (default 100)
        max_matches_per_file:
          type: integer
          minimum: 1
          description: Cap per file (default 10)
        max_total_matches:
          type: integer
          minimum: 1
          description: Total cap (default 100)
        max_tokens:
          type: integer
          minimum: 1
          description: Hard token cap
        max_results:
          type: integer
          minimum: 1
          description: Max files to return (alias for max_files, default 100)
        max_per_item:
          type: integer
          minimum: 1
          description: Cap per file (alias for max_matches_per_file, default 10)
        max_line_length:
          type: integer
          minimum: 1
          description: Truncate lines longer than this
        offset:
          type: integer
          minimum: 0
          description: Skip first N results
    parallel:
      type: boolean
      default: true
      description: Run queries in parallel (default true)
    relationships:
      type: boolean
      description: Include file relationship analysis
    preview_replace:
      type: string
      description: Preview replacement text without applying
    ranked:
      type: boolean
      description: Rank results by relevance
    verbosity:
      type: string
      enum: [count_only, minimal, standard, verbose]
      default: standard
      description: Response verbosity
  required: [queries]
