name: precision_config
description: |
  Get or set precision-engine runtime configuration.
  Supports toggling sandbox mode (path boundary enforcement) and other settings.
  Also provides telemetry queries, per-session state, hook management, and output mode switching.
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum: [get, set, reload, telemetry, state, hooks, mode]
      description: |
        Action to perform:
        - get: Read config value(s)
        - set: Update a config value
        - reload: Reload config from file
        - telemetry: Query usage telemetry
        - state: Per-session key-value store
        - hooks: Manage precision tool hooks
        - mode: Manage output mode (vibecoding, justvibes, default)
    key:
      type: string
      description: |
        Config key to get or set. Available keys: sandbox, cache_mode, cache_max_mb,
        safe_overwrite, backup_dir, backup_git_clean_skip, verbosity_defaults,
        exec_default_timeout_ms, exec_max_output_chars, exec_max_background,
        discover_symbol_timeout_ms, fetch.services, fetch.auth_status.
        Omit for get to return all config.
    value:
      description: Value to set (for set action). Type depends on the key.
    operation:
      type: string
      enum: [get, set, list, clear, summary, query, enable, disable, add, remove]
      description: |
        Sub-operation for action=state (get/set/list/clear),
        action=telemetry (summary/query),
        or action=hooks (list/enable/disable/add/remove).
    keys:
      type: array
      items:
        type: string
      description: For action=state, operation=get or clear — array of key names.
    values:
      type: object
      description: For action=state, operation=set — key-value pairs to store.
    prefix:
      type: string
      description: For action=state, operation=list — filter keys by prefix.
    filter:
      type: object
      description: Filter parameters for action=telemetry, operation=query.
      properties:
        tool:
          type: string
          description: Filter by tool name
        status:
          type: string
          enum: [success, failed, partial]
          description: Filter by call status
        since:
          type: string
          description: ISO 8601 timestamp — only records at or after this time
        limit:
          type: integer
          minimum: 1
          description: Maximum number of records to return
    mode:
      type: string
      description: |
        For action=mode, operation=set — the mode name to activate.
        Built-in modes: vibecoding, justvibes, default.
    event:
      type: string
      enum: [PrePrecisionTool, PostPrecisionTool, OnPrecisionError, OnPrecisionMutation]
      description: For action=hooks — the hook event to operate on.
    hook:
      description: |
        For action=hooks — hook identifier (string) for enable/disable/remove,
        or a HookConfig object for the add operation.
  required:
    - action
