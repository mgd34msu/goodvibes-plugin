name: precision_exec
description: |
  Execute shell commands with batch support, timeout, and expectations checking.
  Captures stdout, stderr, and exit code.
inputSchema:
  type: object
  properties:
    commands:
      type: array
      description: Array of commands to execute
      items:
        type: object
        properties:
          cmd:
            type: string
            description: Command to execute
          args:
            type: array
            items:
              type: string
            description: Command arguments
          cwd:
            type: string
            description: Working directory
          timeout:
            type: integer
            minimum: 1
            description: Timeout in ms (default 60000)
          env:
            type: object
            description: Additional environment variables
          expect:
            type: object
            properties:
              exit_code:
                type: integer
                description: Expected exit code
              stdout_contains:
                type: string
                description: String that stdout should contain
              stderr_contains:
                type: string
                description: String that stderr should contain
            description: Expectations to verify
        required: [cmd]
    parallel:
      type: boolean
      default: false
      description: Execute commands in parallel
    stop_on_error:
      type: boolean
      default: true
      description: Stop on first error (sequential only)
    output_mode:
      type: string
      enum: [count_only, minimal, standard, verbose]
      default: standard
      description: Output verbosity level
  required: [commands]
