name: runtime_status
version: "1.0.0"
description: |
  Get current runtime engine status including active workflows, agents, event queue stats, and system health.
  Use to monitor orchestration state and diagnose issues.

mcp:
  server: runtime-engine
  method: runtime_status
  defer_loading: true

input_schema:
  type: object
  properties:
    include:
      type: array
      items:
        type: string
        enum: ["workflows", "agents", "queue", "triggers", "budget", "health"]
      description: "Sections to include in the response. Default: all."
    verbosity:
      type: string
      enum: ["count_only", "minimal", "standard", "verbose"]
      default: "standard"
      description: "Response detail level."

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Get full status"
    input: {}
  - description: "Get health only, minimal verbosity"
    input:
      include: ["health"]
      verbosity: "minimal"
