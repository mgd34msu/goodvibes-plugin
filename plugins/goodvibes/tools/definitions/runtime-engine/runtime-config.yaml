name: runtime_config
version: "1.0.0"
description: |
  Get or set runtime engine configuration. Supports dot-separated key paths for nested values.
  Use to adjust queue settings, trigger defaults, IPC config, and feature flags.

mcp:
  server: runtime-engine
  method: runtime_config
  defer_loading: true

input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["get", "set", "reset"]
      description: "Action to perform."
    key:
      type: string
      description: "Config key (dot-separated path, e.g., 'queue.max_size'). Omit for full config on 'get'."
    value:
      description: "Value to set. Required for 'set' action."
  required:
    - action

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Get full config"
    input:
      action: "get"
  - description: "Get specific value"
    input:
      action: "get"
      key: "queue.max_size"
  - description: "Set a value"
    input:
      action: "set"
      key: "features.ipc_enabled"
      value: true
  - description: "Reset to defaults"
    input:
      action: "reset"
