name: runtime_daemon
version: "1.0.0"
description: |
  Manage the GoodVibes runtime daemon process.
  Start, stop, check status, or list connected sessions.

mcp:
  server: runtime-engine
  method: runtime_daemon
  defer_loading: true

input_schema:
  type: object
  required: ["action"]
  properties:
    action:
      type: string
      enum: ["start", "stop", "status", "sessions"]
      description: "Daemon management action."

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Check daemon status"
    input:
      action: "status"
  - description: "Start daemon"
    input:
      action: "start"
  - description: "Stop daemon"
    input:
      action: "stop"
  - description: "List connected sessions"
    input:
      action: "sessions"
