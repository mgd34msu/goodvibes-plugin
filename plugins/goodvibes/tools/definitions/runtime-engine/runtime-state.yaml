name: runtime_state
version: "1.0.0"
description: |
  Query the runtime engine in-memory state store.
  Read plugin state by key, list keys in a namespace, discover namespaces, or take snapshots.
  Use to inspect agent-tracker data, WRFC state, or any plugin state.

mcp:
  server: runtime-engine
  method: runtime_state
  defer_loading: true

input_schema:
  type: object
  required:
    - action
  properties:
    action:
      type: string
      enum: ["get", "list", "namespaces", "snapshot"]
      description: "get: read key, list: keys in namespace, namespaces: discover prefixes, snapshot: dump state."
    key:
      type: string
      description: "Dot-separated state key (for get)."
    namespace:
      type: string
      description: "Namespace prefix to filter (for list/snapshot). E.g. 'agent_tracker'."
    prefix:
      type: string
      description: "Alias for namespace."

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Get a specific key"
    input:
      action: get
      key: agent_tracker.agents.abc123
  - description: "List keys in agent_tracker namespace"
    input:
      action: list
      namespace: agent_tracker
  - description: "Discover all namespaces"
    input:
      action: namespaces
  - description: "Snapshot agent_tracker state"
    input:
      action: snapshot
      namespace: agent_tracker
