name: runtime_schedule
version: "1.0.0"
description: |
  Manage named event schedules in the runtime engine.
  List, create, cancel, pause, or resume scheduled events.
  Supports heartbeat, cron, and one-shot schedule types.
  Use preset names (every_minute, every_5_minutes, every_15_minutes,
  every_hour, every_6_hours, daily) or raw interval_ms values.

mcp:
  server: runtime-engine
  method: runtime_schedule
  defer_loading: true

input_schema:
  type: object
  required: ["action"]
  properties:
    action:
      type: string
      enum: ["list", "create", "cancel", "get", "pause", "resume", "heartbeat"]
      description: "Schedule management action."
    schedule_id:
      type: string
      description: "Unique schedule identifier."
    type:
      type: string
      enum: ["heartbeat", "cron", "one_shot"]
      description: "Schedule type (for create action)."
    event_type:
      type: string
      description: "Event type to emit when the schedule fires (for create action)."
    interval_ms:
      type: number
      description: "Recurrence interval in milliseconds (for create action)."
    delay_ms:
      type: number
      description: "Delay before firing in milliseconds (for one_shot create)."
    preset:
      type: string
      enum: ["every_minute", "every_5_minutes", "every_15_minutes", "every_hour", "every_6_hours", "daily"]
      description: "Named interval preset (alternative to interval_ms)."
    payload:
      type: object
      description: "Arbitrary payload forwarded into the emitted event."
    ttl:
      type: number
      description: "Maximum number of fires before the schedule is auto-removed."

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "List all schedules"
    input:
      action: "list"
  - description: "Create a recurring heartbeat every 5 minutes"
    input:
      action: "create"
      schedule_id: "ci_monitor"
      type: "heartbeat"
      event_type: "tick:ci_monitor"
      preset: "every_5_minutes"
  - description: "Cancel a schedule"
    input:
      action: "cancel"
      schedule_id: "ci_monitor"
  - description: "Check heartbeat status"
    input:
      action: "heartbeat"
