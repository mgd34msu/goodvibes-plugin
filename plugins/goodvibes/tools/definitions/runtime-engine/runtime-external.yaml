name: runtime_external
version: "1.0.0"
description: |
  Inspect and control the ExternalPlugin: HTTP webhook listener status,
  normalizer registry, payload normalization testing, and ingestion stats.

mcp:
  server: runtime-engine
  method: runtime_external
  defer_loading: true

input_schema:
  type: object
  required: ["action"]
  properties:
    action:
      type: string
      enum: ["status", "normalizers", "test_normalize", "stats", "queue"]
      description: "External plugin action."
    source:
      type: string
      description: "Normalizer source name (for test_normalize action)."
    payload:
      type: object
      description: "Raw webhook payload to normalize (for test_normalize action)."
    headers:
      type: object
      description: "HTTP headers accompanying the payload (for test_normalize action)."
    since:
      type: string
      description: "Start time for stats/queue filtering (ISO timestamp or relative: '5m', '1h')."

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Check external plugin status"
    input:
      action: "status"
  - description: "List registered normalizers"
    input:
      action: "normalizers"
  - description: "Test GitHub payload normalization"
    input:
      action: "test_normalize"
      source: "github"
      payload:
        ref: "refs/heads/main"
        repository:
          full_name: "org/repo"
  - description: "Check event queue depth"
    input:
      action: "queue"
