name: batch_state
description: |
  Manage persistent state and memory - get, set, query, export, import, or clear.
inputSchema:
  type: object
  properties:
    operation:
      type: string
      enum: [get, set, query, export, import, clear]
      description: The state operation to perform
    get:
      type: object
      description: Options for get operation
      properties:
        keys:
          type: array
          items:
            type: string
          description: Dot-notation paths to retrieve (e.g. session.mode)
    set:
      type: object
      description: Options for set operation
      properties:
        values:
          type: object
          description: Key-value pairs to set
        merge:
          type: boolean
          description: Merge with existing values (default true)
    query:
      type: object
      description: Options for memory query
      properties:
        type:
          type: string
          enum: [decisions, patterns, failures, all]
          description: Type of memory to query
        filters:
          type: object
          properties:
            category:
              type: string
              description: Filter by category
            files:
              type: array
              items:
                type: string
              description: Filter by files
            since:
              type: string
              description: Filter by timestamp
            limit:
              type: number
              description: Limit results
            status:
              type: string
              description: Filter by status
    export:
      type: object
      description: Options for export operation
      properties:
        format:
          type: string
          enum: [json, markdown]
          description: Export format
        include:
          type: array
          items:
            type: string
            enum: [state, memory, telemetry]
          description: What to include in export
        output_path:
          type: string
          description: File path to write (optional)
    import:
      type: object
      description: Options for import operation
      properties:
        format:
          type: string
          enum: [json]
          description: Import format
        source:
          oneOf:
            - type: string
              description: File path or JSON string
            - type: object
              description: Inline data object
        merge:
          type: boolean
          description: Merge with existing data
    clear:
      type: object
      description: Options for clear operation
      properties:
        targets:
          type: array
          items:
            type: string
            enum: [state, memory, telemetry, checkpoints]
          description: What to clear
        confirm:
          type: boolean
          description: Must be true to confirm clear
  required: [operation]
