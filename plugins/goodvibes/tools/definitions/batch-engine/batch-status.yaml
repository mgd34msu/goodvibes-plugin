name: batch_status
description: |
  Check the status of a batch execution, including progress, results, and agent status.
inputSchema:
  type: object
  properties:
    batch_id:
      type: string
      description: ID of the batch to check
    include:
      type: object
      description: What to include in the response
      properties:
        results:
          type: boolean
          description: Include operation results
        telemetry:
          type: boolean
          description: Include telemetry data
        operations:
          type: boolean
          description: Include operation details
        agents:
          type: boolean
          description: Include agent status
    output_mode:
      type: string
      enum: [count_only, minimal, standard, verbose]
      description: Output verbosity level
  required: [batch_id]
