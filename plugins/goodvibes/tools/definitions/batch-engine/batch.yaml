name: batch
description: |
  Execute a batch of operations with transaction support, validation, and recovery.
  The heart of SPEC-v2 orchestration.
inputSchema:
  type: object
  properties:
    discovery:
      type: object
      description: Optional discovery phase to gather context before operations
      properties:
        queries:
          type: array
          items:
            type: object
          description: Discovery queries to execute
        inject_results:
          type: boolean
          description: Inject results into operation context
    operations:
      type: object
      description: Operations grouped by phase - read, write, exec, query, state
      properties:
        read:
          type: array
          items:
            type: object
          description: Read operations
        write:
          type: array
          items:
            type: object
          description: Write operations
        exec:
          type: array
          items:
            type: object
          description: Command execution operations
        query:
          type: array
          items:
            type: object
          description: Query operations
        state:
          type: array
          items:
            type: object
          description: State management operations
    config:
      type: object
      description: Batch configuration for transaction, execution, preview, validation, and recovery
    dry_run:
      type: boolean
      description: Preview without executing
    preview:
      type: boolean
      description: Return preview of what would be done
    timeout_ms:
      type: number
      description: Timeout for batch execution
    output_mode:
      type: string
      enum: [count_only, minimal, standard, verbose]
      description: Output verbosity level
  required: []
