name: log_analyzer
version: "1.0.0"
description: |
  Analyze log files for patterns, errors, and anomalies.
  Parses structured (JSON) and unstructured logs, identifies error spikes,
  correlates events, and provides timeline analysis.

category: analysis
tags:
  - logs
  - analysis
  - errors
  - patterns
  - debugging
  - monitoring

mcp:
  server: goodvibes-tools
  method: log_analyzer
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: Path to log file or directory
    format:
      type: string
      enum: [auto, json, text, apache, nginx]
      description: "Log format (default: auto-detect)"
      default: auto
    time_range:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
      description: Time range to analyze (ISO 8601 format)
    patterns:
      type: array
      items:
        type: string
      description: Custom patterns to search for
    group_by:
      type: string
      enum: [level, source, hour, message]
      description: Group results by field
  required:
    - path

handler:
  type: native
  module: analysis
  function: handleLogAnalyzer
