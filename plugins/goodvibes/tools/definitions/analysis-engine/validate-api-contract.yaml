name: validate_api_contract
version: "1.0.0"
description: |
  Validate API responses against OpenAPI spec.
  Makes requests to each endpoint and verifies response status codes
  and body schemas match the spec. Reports violations with JSON paths.

category: validation
tags:
  - openapi
  - api
  - validation
  - contract-testing
  - schema

mcp:
  server: goodvibes-tools
  method: validate_api_contract
  defer_loading: true

inputSchema:
  type: object
  properties:
    spec_path:
      type: string
      description: Path to OpenAPI spec file (JSON or YAML)
    base_url:
      type: string
      description: Base URL of running API
    endpoints:
      type: array
      items:
        type: string
      description: "Specific endpoints to test (default: all)"
    include_examples:
      type: boolean
      description: Use spec examples as request data
      default: true
    timeout:
      type: integer
      description: Per-request timeout in ms
      default: 10000
    auth_header:
      type: string
      description: Authorization header value if needed
  required:
    - spec_path
    - base_url

handler:
  type: native
  module: validation
  function: handleValidateApiContract
