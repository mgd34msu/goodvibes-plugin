name: sync_api_types
version: "1.0.0"
description: |
  Detect type drift between backend API routes and frontend API calls.
  Compares types defined in backend route handlers with types used in
  frontend fetch/axios calls to identify mismatches, missing types,
  and endpoints that don't exist.

category: types
tags:
  - typescript
  - api
  - type-drift
  - fullstack
  - synchronization

mcp:
  server: goodvibes-tools
  method: sync_api_types
  defer_loading: true

inputSchema:
  type: object
  properties:
    backend_path:
      type: string
      description: "Path to backend API routes (default: auto-detect from src/app/api, pages/api, src/routes)"
    frontend_path:
      type: string
      description: Path to frontend source files
      default: "src"
    api_pattern:
      type: string
      description: Regex pattern to identify API call sites
      default: "fetch|axios|api\\."
    auto_fix:
      type: boolean
      description: Generate fix suggestions for drifts
      default: false

handler:
  type: native
  module: types
  function: handleSyncApiTypes
