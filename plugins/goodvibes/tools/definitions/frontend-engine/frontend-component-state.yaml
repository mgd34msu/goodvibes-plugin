name: frontend_component_state
version: "1.0.0"
description: |
  Trace React state and props through component trees.
  Analyzes useState, useReducer, useRef, useContext, and effect hooks.
  Detects prop drilling, callback instability, missing memoization, and
  other common React anti-patterns. Returns detailed state flow analysis
  including which state is used in JSX and passed to children.

category: frontend
tags:
  - react
  - state
  - hooks
  - props
  - debugging
  - performance
  - anti-patterns

mcp:
  server: goodvibes-tools
  method: frontend_component_state
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: File path to analyze (relative to project root or absolute). Must be a React component file (.tsx, .jsx)
    include_children:
      type: boolean
      description: Analyze imported child components
      default: false
    depth:
      type: integer
      description: How deep to trace child components when include_children is true
      default: 2
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleTraceComponentState
