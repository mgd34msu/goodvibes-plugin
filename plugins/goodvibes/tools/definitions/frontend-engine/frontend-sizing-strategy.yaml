name: frontend_sizing_strategy
version: "1.0.0"
description: |
  Analyze how a specific element's size is determined.
  Examines Tailwind classes or CSS to identify width/height strategies
  (fixed, percentage, viewport, content-based, flex-controlled, grid-controlled),
  min/max constraints, flex behavior (grow, shrink, basis), grid placement,
  overflow settings, and positioning context. Walks the ancestor chain to find
  constraints that affect the target element. Returns a human-readable summary
  explaining how the element's dimensions are computed.

category: frontend
tags:
  - css
  - sizing
  - layout
  - tailwind
  - flexbox
  - grid
  - debugging

mcp:
  server: goodvibes-tools
  method: frontend_sizing_strategy
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: Component file path to analyze (relative to project root or absolute). Supports .tsx, .jsx, .ts, .js files.
    selector:
      type: string
      description: "Element selector: class (.className), id (#id), or tag name. Finds the first matching element in the component tree."
  required:
    - file
    - selector

handler:
  type: native
  module: frontend
  function: handleGetSizingStrategy
