name: frontend_responsive_breakpoints
version: "1.0.0"
description: |
  Analyze responsive Tailwind classes across breakpoints.
  Detects mobile-first patterns, tracks property changes across breakpoints
  (sm, md, lg, xl, 2xl), identifies breakpoint coverage gaps, and flags
  potential responsive design issues like desktop-first patterns or missing
  base styles. Supports custom breakpoints via explicit parameter or automatic
  tailwind.config.js/ts detection.

category: frontend
tags:
  - tailwind
  - responsive
  - breakpoints
  - css
  - mobile-first
  - react

mcp:
  server: goodvibes-tools
  method: frontend_responsive_breakpoints
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: File path to analyze (supports .tsx, .jsx, .ts, .js)
    element:
      type: string
      description: "Optional: specific element to analyze (e.g., \"div\" or \"Button#3\"). If not provided, analyzes all elements."
    breakpoints:
      type: object
      description: "Optional: custom breakpoint overrides as a map of name to min-width size (e.g., { xs: '480px', '3xl': '1920px' }). Overrides matching defaults; new keys are added. Tailwind config is auto-detected when this is omitted."
      additionalProperties:
        type: string
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleAnalyzeResponsiveBreakpoints
