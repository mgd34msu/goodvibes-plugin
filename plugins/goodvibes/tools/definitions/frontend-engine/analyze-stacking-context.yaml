name: analyze_stacking_context
version: "1.0.0"
description: |
  Analyze z-index and stacking contexts in React components.
  Detects which CSS properties create new stacking contexts (position+z-index,
  transform, opacity, filter, isolation, etc.), builds a hierarchical stacking
  tree, identifies potential z-index conflicts, and finds portal destinations.
  Essential for debugging "why isn't my z-index working" issues.

category: frontend
tags:
  - css
  - z-index
  - stacking-context
  - layout
  - debugging
  - react

mcp:
  server: goodvibes-tools
  method: analyze_stacking_context
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: File path to analyze (relative to project root or absolute). Supports .tsx, .jsx, .ts, .js
    include_portals:
      type: boolean
      description: Look for portal destinations (createPortal, Radix Portal, etc.)
      default: true
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleAnalyzeStackingContext
