name: get_accessibility_tree
version: "1.0.0"
description: |
  Build an accessibility tree and detect WCAG issues in React components.
  Analyzes semantic HTML roles, focus order, keyboard interactions, and ARIA patterns.
  Detects issues like missing alt text (1.1.1), unlabeled form inputs (1.3.1),
  buttons/links without accessible names (4.1.2), click handlers on non-interactive
  elements, missing focus indicators (2.4.7), and invalid ARIA patterns.
  Returns a hierarchical accessibility tree, focus order sequence, issues with
  WCAG criteria references, and optimization suggestions.

category: frontend
tags:
  - accessibility
  - a11y
  - wcag
  - aria
  - semantic-html
  - keyboard
  - screen-reader

mcp:
  server: goodvibes-tools
  method: get_accessibility_tree
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: Component file path to analyze (relative to project root or absolute). Supports .tsx, .jsx, .ts, .js files.
    element:
      type: string
      description: "Optional: Focus on specific element by tag name or component name. If omitted, analyzes entire component tree."
    check_patterns:
      type: boolean
      description: Validate ARIA patterns for roles like dialog, combobox, tabs, etc.
      default: true
  required:
    - file

handler:
  type: native
  module: frontend
  function: handleGetAccessibilityTree
