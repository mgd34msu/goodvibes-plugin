name: analyze_error_boundaries
version: "1.0.0"
description: |
  Analyzes React/Next.js projects for error boundary coverage. Detects class-based
  error boundaries (getDerivedStateFromError / componentDidCatch) and library wrappers
  (react-error-boundary, Sentry, etc.), analyzes which component subtrees are protected,
  identifies missing error.tsx files in Next.js App Router route segments, and flags
  issues like missing fallback UI, missing reset/retry mechanisms, overly broad boundaries,
  and async components without protection.

category: frontend
tags:
  - react
  - nextjs
  - error-boundary
  - error-handling
  - reliability
  - coverage
  - app-router

mcp:
  server: goodvibes-tools
  method: analyze_error_boundaries
  defer_loading: true

inputSchema:
  type: object
  properties:
    project_path:
      type: string
      description: Root directory of the React/Next.js project to analyze
    entry:
      type: string
      description: Optional entry file to start analysis from instead of scanning the entire project
    include_library_boundaries:
      type: boolean
      default: true
      description: Include detection of library error boundaries (react-error-boundary, Sentry, etc.)
  required:
    - project_path

handler:
  type: native
  module: frontend
  function: handleAnalyzeErrorBoundaries
