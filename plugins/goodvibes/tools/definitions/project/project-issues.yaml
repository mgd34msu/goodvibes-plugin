name: project_issues
version: "1.0.0"
description: |
  Get detailed project issues: high-priority TODOs with file:line,
  health warnings, environment issues.
  Scans the codebase for actionable issues and returns them
  in a structured format with locations and severity levels.

category: project
tags:
  - todos
  - issues
  - health
  - warnings
  - project-management

mcp:
  server: goodvibes-tools
  method: project_issues
  defer_loading: false

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: Project root path
      default: "."
    include_low_priority:
      type: boolean
      description: Include low-priority TODOs
      default: false

handler:
  type: native
  module: project
  function: handleProjectIssues
