name: smart_glob
version: "1.0.0"
description: |
  Find files matching glob patterns with intelligent filtering and optional preview.
  Supports multiple patterns, exclusions, and configurable output modes.
  Use this instead of multiple Glob calls.

  Features:
  - Multiple glob patterns in one call
  - Exclusion patterns
  - File preview with offset/limit (like batch_read precision)
  - Auto-ignores common directories (node_modules, .git, dist, etc.)
  - Output modes: count_only, minimal (paths only), standard (with metadata)

category: batch
tags:
  - glob
  - files
  - search
  - patterns
  - efficiency
  - discovery

mcp:
  server: goodvibes-tools
  method: smart_glob
  defer_loading: true

inputSchema:
  type: object
  properties:
    patterns:
      type: array
      items:
        type: string
      description: |
        Glob patterns to match. Supports:
        - * matches any characters except /
        - ** matches any characters including /
        - ? matches single character
        - [abc] character class
        - {a,b} alternation
    exclude:
      type: array
      items:
        type: string
      description: Patterns to exclude from results
    output_mode:
      type: string
      description: Output verbosity (default standard)
      enum: [count_only, minimal, standard]
      default: standard
    limit:
      type: integer
      description: Maximum number of files to return (default 100, max 1000)
      default: 100
      maximum: 1000
    preview:
      type: object
      description: Optional preview configuration for file content
      properties:
        enabled:
          type: boolean
          description: Enable preview (only works with output_mode standard)
        lines:
          type: integer
          description: Number of lines to preview (default 10)
          default: 10
        offset:
          type: integer
          description: Start line for preview (1-based, default 1)
          default: 1
  required:
    - patterns

outputSchema:
  type: object
  properties:
    files:
      type: array
      description: Matching files (format depends on output_mode)
      items:
        oneOf:
          - type: string
            description: File path (minimal mode)
          - type: object
            description: File info (standard mode)
            properties:
              path:
                type: string
              size:
                type: integer
              modified:
                type: string
              preview:
                type: object
                description: Preview if enabled
                properties:
                  content:
                    type: string
                  total_lines:
                    type: integer
                  has_more:
                    type: boolean
    count:
      type: integer
      description: Total count of matching files
    truncated:
      type: boolean
      description: Whether results were truncated due to limit
    patterns:
      type: array
      items:
        type: string
      description: Patterns that were matched
    excluded:
      type: array
      items:
        type: string
      description: Patterns that were excluded

handler:
  type: native
  module: batch
  function: handleSmartGlob

examples:
  - description: "Find all TypeScript files except tests"
    input:
      patterns:
        - "**/*.ts"
        - "**/*.tsx"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
      output_mode: minimal
      limit: 50
    output:
      files:
        - "src/index.ts"
        - "src/utils.ts"
        - "src/components/Button.tsx"
      count: 3
      truncated: false
      patterns:
        - "**/*.ts"
        - "**/*.tsx"
      excluded:
        - "**/*.test.ts"
        - "**/*.spec.ts"

  - description: "Find config files with preview"
    input:
      patterns:
        - "**/*.config.ts"
        - "**/*.config.js"
      preview:
        enabled: true
        lines: 5
    output:
      files:
        - path: "vite.config.ts"
          size: 1234
          modified: "2024-01-15T10:30:00Z"
          preview:
            content: "import { defineConfig } from 'vite';\n..."
            total_lines: 45
            has_more: true
      count: 1
      truncated: false
      patterns:
        - "**/*.config.ts"
        - "**/*.config.js"

  - description: "Quick count of matching files"
    input:
      patterns:
        - "**/*.ts"
      output_mode: count_only
    output:
      count: 150
      truncated: false
      patterns:
        - "**/*.ts"
