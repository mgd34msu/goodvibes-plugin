name: batch_read
version: "1.0.0"
description: |
  Read multiple files in a single operation with per-file precision control.
  Supports offset/limit for each file individually, enabling surgical reads
  that minimize token usage. Use this instead of multiple Read calls.

  Features:
  - Per-file offset/limit (read specific line ranges)
  - Mixed input: simple paths or detailed FileReadRequest objects
  - Range metadata in results (has_more_before/after)
  - Output modes: minimal (line counts), standard (first 50 lines), verbose (full)

category: batch
tags:
  - reading
  - files
  - batch
  - efficiency
  - precision
  - token-saving

mcp:
  server: goodvibes-tools
  method: batch_read
  defer_loading: true

inputSchema:
  type: object
  properties:
    files:
      type: array
      description: |
        Array of files to read. Supports mixed format:
        - Simple string paths: "src/index.ts"
        - FileReadRequest objects: {"path": "src/index.ts", "offset": 50, "limit": 30}
      items:
        oneOf:
          - type: string
            description: Simple file path (reads entire file)
          - type: object
            properties:
              path:
                type: string
                description: File path (relative to project root or absolute)
              offset:
                type: integer
                description: Start line (1-based). Omit to start from line 1
                minimum: 1
              limit:
                type: integer
                description: Max lines to read. Omit to read to end
                minimum: 1
            required:
              - path
    output_mode:
      type: string
      description: Output verbosity (default standard)
      enum: [minimal, standard, verbose]
      default: standard
  required:
    - files

outputSchema:
  type: object
  properties:
    files:
      type: array
      items:
        type: object
        properties:
          file:
            type: string
            description: File path
          exists:
            type: boolean
            description: Whether the file exists
          total_lines:
            type: integer
            description: Total lines in file (always returned if exists)
          size:
            type: integer
            description: File size in bytes
          content:
            type: string
            description: File content (based on output_mode and offset/limit)
          error:
            type: string
            description: Error message if read failed
          range:
            type: object
            description: Range metadata for returned content
            properties:
              start:
                type: integer
                description: Actual start line (1-based)
              end:
                type: integer
                description: Actual end line (inclusive)
              lines_returned:
                type: integer
                description: Number of lines in content
              has_more_before:
                type: boolean
                description: Content exists before start
              has_more_after:
                type: boolean
                description: Content exists after end
    success_count:
      type: integer
      description: Number of files successfully read
    error_count:
      type: integer
      description: Number of files that failed
    total_lines:
      type: integer
      description: Total lines across all files

handler:
  type: native
  module: batch
  function: handleBatchRead

examples:
  - description: "Read multiple files with per-file precision"
    input:
      files:
        - path: "src/auth.ts"
          offset: 150
          limit: 30
        - path: "src/db.ts"
          offset: 1
          limit: 50
        - "src/utils.ts"
      output_mode: verbose
    output:
      files:
        - file: "src/auth.ts"
          exists: true
          total_lines: 300
          content: "// Lines 150-179..."
          range:
            start: 150
            end: 179
            lines_returned: 30
            has_more_before: true
            has_more_after: true
        - file: "src/db.ts"
          exists: true
          total_lines: 200
          content: "// Lines 1-50..."
          range:
            start: 1
            end: 50
            lines_returned: 50
            has_more_before: false
            has_more_after: true
        - file: "src/utils.ts"
          exists: true
          total_lines: 100
          content: "// Full file..."
          range:
            start: 1
            end: 100
            lines_returned: 100
            has_more_before: false
            has_more_after: false
      success_count: 3
      error_count: 0
      total_lines: 600

  - description: "Quick metadata check (no content)"
    input:
      files:
        - "src/large-file.ts"
        - "src/another.ts"
      output_mode: minimal
    output:
      files:
        - file: "src/large-file.ts"
          exists: true
          total_lines: 5000
          size: 150000
        - file: "src/another.ts"
          exists: true
          total_lines: 200
          size: 5000
      success_count: 2
      error_count: 0
      total_lines: 5200
