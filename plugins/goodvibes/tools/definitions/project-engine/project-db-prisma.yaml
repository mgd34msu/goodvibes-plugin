name: project_db_prisma
version: "2.0.0"
description: |
  Analyze Prisma schema and list available operations, detecting N+1 query patterns.

category: database
tags:
  - database
  - prisma
  - schema
  - n1-detection
  - orm
  - analysis

mcp:
  server: project-engine
  method: project_db_prisma
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Project root or path to Prisma schema. Auto-detected if not specified."
    include_n1_detection:
      type: boolean
      description: "Detect N+1 query patterns in the codebase. Defaults to true."
  required: []

examples:
  - description: "Analyze Prisma schema and detect N+1 patterns in current project"
    input: {}
  - description: "Analyze a specific Prisma schema without N+1 detection"
    input:
      path: "./prisma/schema.prisma"
      include_n1_detection: false
