name: upgrade_package
version: "1.0.0"
description: |
  Upgrade an npm package with comprehensive breaking change detection.
  Analyzes changelog for breaking changes, checks which packages depend
  on this one, and optionally runs tests after upgrade.
  Supports dry run mode for safe preview before making changes.

category: project
tags:
  - npm
  - dependencies
  - upgrade
  - breaking-changes
  - changelog

mcp:
  server: goodvibes-tools
  method: upgrade_package
  defer_loading: true

inputSchema:
  type: object
  properties:
    package:
      type: string
      description: Name of the npm package to upgrade
    target_version:
      type: string
      description: Target version to upgrade to
      default: "latest"
    include_changelog:
      type: boolean
      description: Fetch and analyze release notes for breaking changes
      default: true
    dry_run:
      type: boolean
      description: Preview only, do not actually upgrade
      default: true
    run_tests_after:
      type: boolean
      description: Run tests after upgrade to verify compatibility
      default: false
    path:
      type: string
      description: Project root path (defaults to current directory)
  required:
    - package

handler:
  type: native
  module: project
  function: handleUpgradePackage
