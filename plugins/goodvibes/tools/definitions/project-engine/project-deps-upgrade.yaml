name: project_deps_upgrade
version: "2.0.0"
description: |
  Upgrade a specific package with compatibility checks, changelog analysis, and optional test execution.

category: deps
tags:
  - dependencies
  - upgrade
  - npm
  - packages
  - changelog

mcp:
  server: project-engine
  method: project_deps_upgrade
  defer_loading: true

inputSchema:
  type: object
  properties:
    package:
      type: string
      description: "Package name to upgrade."
    target_version:
      type: string
      description: 'Target version to upgrade to. Defaults to "latest".'
    include_changelog:
      type: boolean
      description: "Fetch and summarize the package changelog. Defaults to true."
    dry_run:
      type: boolean
      description: "Analyze without actually installing. Defaults to false."
    run_tests_after:
      type: boolean
      description: "Run test suite after upgrade to verify compatibility. Defaults to false."
    path:
      type: string
      description: "Project root path. Defaults to current working directory."
  required:
    - package

examples:
  - description: "Dry-run upgrade of react to latest with changelog"
    input:
      package: "react"
      dry_run: true
      include_changelog: true
  - description: "Upgrade a specific package to a pinned version and run tests"
    input:
      package: "zod"
      target_version: "3.22.0"
      run_tests_after: true
