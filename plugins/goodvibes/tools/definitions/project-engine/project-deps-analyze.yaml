name: project_deps_analyze
version: "2.0.0"
description: |
  Analyze project dependencies for outdated packages, unused imports, and duplicate versions.

category: deps
tags:
  - dependencies
  - npm
  - audit
  - outdated
  - packages

mcp:
  server: project-engine
  method: project_deps_analyze
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Project root directory. Defaults to current working directory."
    check_updates:
      type: boolean
      description: "Fetch latest versions from npm to detect outdated packages. Defaults to false."
    include_dev:
      type: boolean
      description: "Include devDependencies in the analysis. Defaults to true."
  required: []

examples:
  - description: "Analyze dependencies including update checks"
    input:
      check_updates: true
      include_dev: true
  - description: "Analyze only production dependencies in a specific project"
    input:
      path: "/home/user/my-project"
      check_updates: false
      include_dev: false
