name: project_runtime_memory
version: "2.0.0"
description: |
  Detect potential memory leaks in a running Node.js process by monitoring heap growth over time.

category: runtime
tags:
  - runtime
  - memory
  - heap
  - leaks
  - node
  - profiling

mcp:
  server: project-engine
  method: project_runtime_memory
  defer_loading: true

inputSchema:
  type: object
  properties:
    target:
      type: string
      enum:
        - pid
        - command
      description: "Whether to monitor an existing PID or spawn a new command."
    pid:
      type: number
      description: 'Process ID to monitor (required when target is "pid").'
    command:
      type: string
      description: 'Command to spawn and monitor (required when target is "command").'
    duration_seconds:
      type: number
      description: "How long to monitor in seconds. Defaults to 60."
    snapshot_interval_ms:
      type: number
      description: "Interval between memory snapshots in milliseconds. Defaults to 5000."
    threshold_mb:
      type: number
      description: "Heap growth threshold in MB to classify as a leak. Defaults to 50."
    cwd:
      type: string
      description: "Working directory for spawned commands."
  required:
    - target

examples:
  - description: "Monitor a running process by PID for 60 seconds"
    input:
      target: "pid"
      pid: 12345
      duration_seconds: 60
  - description: "Spawn a server command and detect memory leaks"
    input:
      target: "command"
      command: "node server.js"
      duration_seconds: 120
      threshold_mb: 100
