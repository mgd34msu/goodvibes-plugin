name: project_api_validate
version: "2.0.0"
description: |
  Validate API implementation against its OpenAPI contract/spec by making live requests.

category: api
tags:
  - api
  - validation
  - openapi
  - contract-testing
  - live-requests

mcp:
  server: project-engine
  method: project_api_validate
  defer_loading: true

inputSchema:
  type: object
  properties:
    spec_path:
      type: string
      description: "Path to the OpenAPI spec file (JSON or YAML)."
    base_url:
      type: string
      description: "Base URL of the running API server to validate against."
    endpoints:
      type: array
      items:
        type: string
      description: "Specific endpoint paths to validate. Validates all if not specified."
    include_examples:
      type: boolean
      description: "Use spec examples as request bodies. Defaults to true."
    timeout:
      type: number
      description: "Request timeout in milliseconds. Defaults to 10000."
    auth_header:
      type: string
      description: "Authorization header value for authenticated endpoints."
  required:
    - spec_path
    - base_url

examples:
  - description: "Validate all endpoints against local dev server"
    input:
      spec_path: "./openapi.json"
      base_url: "http://localhost:3000"
  - description: "Validate specific endpoints with auth header"
    input:
      spec_path: "./openapi.yaml"
      base_url: "http://localhost:3000"
      endpoints: ["/users", "/users/{id}"]
      auth_header: "Bearer my-dev-token"
      timeout: 5000
