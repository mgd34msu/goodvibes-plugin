name: scaffold
version: "2.0.0"
description: |
  Scaffold a new project from templates with variable substitution and optional git/npm initialization.

category: standalone
tags:
  - scaffold
  - templates
  - project
  - generator
  - boilerplate

mcp:
  server: project-engine
  method: scaffold
  defer_loading: true

inputSchema:
  type: object
  properties:
    template:
      type: string
      description: 'Template name to scaffold from (e.g., "next-app", "vite-react", "next-saas").'
    output_dir:
      type: string
      description: "Absolute path to the output directory where the project will be created."
    variables:
      type: object
      description: "Template variable substitutions (key-value pairs)."
      additionalProperties:
        type: string
    run_install:
      type: boolean
      description: "Run npm/pnpm install after scaffolding. Defaults to false."
    run_git_init:
      type: boolean
      description: "Run git init after scaffolding. Defaults to false."
  required:
    - template
    - output_dir

examples:
  - description: "Scaffold a Next.js SaaS app with install and git init"
    input:
      template: "next-saas"
      output_dir: "/home/user/projects/my-saas"
      variables:
        project_name: "my-saas"
        author: "Jane Doe"
      run_install: true
      run_git_init: true
  - description: "Scaffold a Vite React app without install"
    input:
      template: "vite-react"
      output_dir: "/home/user/projects/my-app"
