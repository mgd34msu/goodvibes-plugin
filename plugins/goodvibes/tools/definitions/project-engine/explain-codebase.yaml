name: explain_codebase
version: "1.0.0"
description: |
  Generate a high-level explanation of a codebase using LLM analysis.
  Gathers information from stack detection, API routes, conventions,
  and directory structure to produce a comprehensive overview including
  architecture diagrams, key files, entry points, and potential concerns.

category: project
tags:
  - codebase
  - documentation
  - architecture
  - analysis
  - llm
  - onboarding

mcp:
  server: goodvibes-tools
  method: explain_codebase
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: Directory to analyze (defaults to project root)
      default: "."
    depth:
      type: string
      enum: [shallow, medium, deep]
      description: "Analysis depth: shallow (fast overview), medium (default, balanced), deep (thorough analysis)"
      default: medium
    focus:
      type: array
      items:
        type: string
      description: "Specific areas to detail (e.g., [\"auth\", \"api\", \"database\"])"
    refresh:
      type: boolean
      description: Regenerate even if cached
      default: false
    include_architecture:
      type: boolean
      description: Generate ASCII architecture diagram
      default: true

handler:
  type: native
  module: project
  function: handleExplainCodebase
