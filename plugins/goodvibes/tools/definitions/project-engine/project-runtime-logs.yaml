name: project_runtime_logs
version: "2.0.0"
description: |
  Analyze application logs for patterns, anomalies, error frequency, and rate changes.

category: runtime
tags:
  - runtime
  - logs
  - analysis
  - patterns
  - errors
  - monitoring

mcp:
  server: project-engine
  method: project_runtime_logs
  defer_loading: true

inputSchema:
  type: object
  properties:
    source:
      type: string
      enum:
        - file
        - command
      description: "Whether to read from a log file or capture output from a command."
    path:
      type: string
      description: 'Path to the log file (required when source is "file").'
    command:
      type: string
      description: 'Command to run and capture output from (required when source is "command").'
    duration_seconds:
      type: number
      description: "How long to capture command output in seconds. Defaults to 30."
    tail_lines:
      type: number
      description: "Number of lines from the end of the log file to analyze. Defaults to 1000."
    structured:
      type: boolean
      description: "Parse as structured JSON logs. Auto-detected if not specified."
    patterns:
      type: array
      description: "Custom patterns to count in the logs."
      items:
        type: object
        properties:
          name:
            type: string
          pattern:
            type: string
        additionalProperties: false
        required:
          - name
          - pattern
    time_window:
      type: string
      description: 'Time window for rate analysis (e.g., "1h", "30m", "1d").'
    cwd:
      type: string
      description: "Working directory for spawned commands."
  required:
    - source

examples:
  - description: "Analyze the last 500 lines of an application log file"
    input:
      source: "file"
      path: "/var/log/app/server.log"
      tail_lines: 500
      time_window: "1h"
  - description: "Capture and analyze logs from a running command with custom patterns"
    input:
      source: "command"
      command: "npm run dev"
      duration_seconds: 30
      patterns:
        - name: "auth_failures"
          pattern: "authentication failed"
        - name: "db_errors"
          pattern: "database error"
