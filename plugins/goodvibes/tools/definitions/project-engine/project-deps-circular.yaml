name: project_deps_circular
version: "2.0.0"
description: |
  Find circular dependency chains in the codebase using depth-first search.

category: deps
tags:
  - dependencies
  - circular
  - imports
  - analysis
  - graph

mcp:
  server: project-engine
  method: project_deps_circular
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Project root or directory to scan. Defaults to current working directory."
    include_node_modules:
      type: boolean
      description: "Include node_modules in the dependency graph. Defaults to false."
  required: []

examples:
  - description: "Find circular deps in the current project"
    input: {}
  - description: "Scan a specific directory including node_modules"
    input:
      path: "/home/user/my-project/src"
      include_node_modules: false
