name: project_code_preview_edits
version: "2.0.0"
description: |
  Preview and validate code edits before applying them, checking for TypeScript errors introduced by each edit.

category: code-intelligence
tags:
  - validation
  - typescript
  - preview
  - editing

mcp:
  server: project-engine
  method: project_code_preview_edits
  defer_loading: true

inputSchema:
  type: object
  properties:
    edits:
      type: array
      description: "Array of proposed edits to validate."
      items:
        type: object
        properties:
          file:
            type: string
            description: "Absolute path to the file to edit."
          old_text:
            type: string
            description: "Text to replace (for find-replace edits)."
          new_text:
            type: string
            description: "Replacement text."
          content:
            type: string
            description: "Full new content for the file (for full-file replacement)."
        additionalProperties: false
        required:
          - file
  required:
    - edits

examples:
  - description: "Preview a find-replace edit to validate no TypeScript errors are introduced"
    input:
      edits:
        - file: "/home/user/project/src/auth/session.ts"
          old_text: "export function getSession(req: Request)"
          new_text: "export function getSession(req: Request, opts?: SessionOptions)"
