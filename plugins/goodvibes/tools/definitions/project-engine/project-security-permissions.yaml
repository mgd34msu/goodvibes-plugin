name: project_security_permissions
version: "2.0.0"
description: |
  Check files for dangerous permission patterns — filesystem access, network calls, process execution, and crypto usage.

category: security
tags:
  - security
  - permissions
  - patterns
  - analysis

mcp:
  server: project-engine
  method: project_security_permissions
  defer_loading: true

inputSchema:
  type: object
  properties:
    file:
      type: string
      description: "Specific file to analyze for permission patterns."
    path:
      type: string
      description: "Directory to scan recursively. Used if \"file\" is not specified."
  required: []

examples:
  - description: "Scan a specific file for dangerous permission patterns"
    input:
      file: "/home/user/project/src/server/exec.ts"
  - description: "Scan an entire directory for dangerous patterns"
    input:
      path: "src/server"
