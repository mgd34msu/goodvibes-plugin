name: project_api_routes
version: "2.0.0"
description: |
  Discover API routes from framework files (Express, Next.js, Fastify, Hono).

category: api
tags:
  - api
  - routes
  - discovery
  - nextjs
  - express
  - fastify
  - hono

mcp:
  server: project-engine
  method: project_api_routes
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Project root path to scan for routes. Defaults to current working directory."
    framework:
      type: string
      enum: [nextjs, express, fastify, hono, auto]
      description: "Framework to detect routes for. Defaults to \"auto\" (auto-detect)."
  required: []

examples:
  - description: "Auto-detect and list all routes in current project"
    input: {}
  - description: "Discover Next.js routes in a specific project directory"
    input:
      path: "/home/user/my-app"
      framework: "nextjs"
