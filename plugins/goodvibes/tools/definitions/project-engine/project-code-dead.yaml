name: project_code_dead
version: "2.0.0"
description: |
  Find dead/unused code (exports, functions, variables) in the project using TypeScript language service.

category: code-intelligence
tags:
  - dead-code
  - unused
  - typescript
  - refactoring

mcp:
  server: project-engine
  method: project_code_dead
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Directory or file path to scan. Defaults to project root."
    include_tests:
      type: boolean
      description: "Whether to include test files in the analysis. Defaults to false."
  required: []

examples:
  - description: "Find dead code in the entire project"
    input: {}
  - description: "Find dead code in a specific directory, including test files"
    input:
      path: "src/features/auth"
      include_tests: true
