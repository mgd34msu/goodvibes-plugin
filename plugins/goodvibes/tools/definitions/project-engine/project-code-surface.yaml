name: project_code_surface
version: "2.0.0"
description: |
  Get the public API surface (exports) of files or modules, distinguishing public from internal APIs.

category: code-intelligence
tags:
  - api-surface
  - exports
  - typescript
  - modules

mcp:
  server: project-engine
  method: project_code_surface
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Directory or file path to analyze. Defaults to project root."
    entry_points:
      type: array
      items:
        type: string
      description: "Explicit entry point files to treat as public API boundaries."
  required: []

examples:
  - description: "Get the public API surface for the entire project"
    input: {}
  - description: "Analyze API surface for a specific module with explicit entry points"
    input:
      path: "src/features/payments"
      entry_points:
        - "src/features/payments/index.ts"
        - "src/features/payments/types.ts"
