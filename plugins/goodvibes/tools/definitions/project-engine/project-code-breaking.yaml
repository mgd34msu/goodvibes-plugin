name: project_code_breaking
version: "2.0.0"
description: |
  Detect breaking changes between two git refs by comparing exported TypeScript API signatures.

category: code-intelligence
tags:
  - breaking-changes
  - typescript
  - api
  - git
  - semver

mcp:
  server: project-engine
  method: project_code_breaking
  defer_loading: true

inputSchema:
  type: object
  properties:
    before_ref:
      type: string
      description: "Git ref (commit hash, branch, tag) representing the \"before\" state."
    after_ref:
      type: string
      description: "Git ref representing the \"after\" state. Defaults to current working tree."
    path:
      type: string
      description: "File or directory path filter for the comparison."
    timeout:
      type: number
      description: "Timeout in seconds for LLM analysis. Defaults to 120."
    model:
      type: string
      enum:
        - haiku
        - sonnet
        - opus
      description: "LLM model to use for analysis."
  required:
    - before_ref

examples:
  - description: "Detect breaking changes since the last release tag"
    input:
      before_ref: "v1.2.0"
  - description: "Check for breaking changes in a specific directory between two branches"
    input:
      before_ref: "main"
      after_ref: "feature/new-api"
      path: "src/api"
      model: "sonnet"
