name: project_db_query
version: "2.0.0"
description: |
  Execute read-only database queries against PostgreSQL, MySQL, or SQLite databases.

category: database
tags:
  - database
  - query
  - sql
  - postgresql
  - mysql
  - sqlite
  - readonly

mcp:
  server: project-engine
  method: project_db_query
  defer_loading: true

inputSchema:
  type: object
  properties:
    query:
      type: string
      description: "SQL query to execute."
    database_url:
      type: string
      description: "Database connection URL. Reads from DATABASE_URL env var if not provided."
    readonly:
      type: boolean
      description: "Enforce read-only mode (reject INSERT/UPDATE/DELETE). Defaults to true."
    limit:
      type: number
      description: "Maximum number of rows to return. Defaults to 100."
    format:
      type: string
      enum: [json, table]
      description: "Output format. Defaults to \"json\"."
    explain:
      type: boolean
      description: "Also run EXPLAIN on the query. Defaults to false."
    params:
      type: array
      description: "Parameterized query values."
      items: {}
  required:
    - query

examples:
  - description: "Run a simple SELECT query against the default DATABASE_URL"
    input:
      query: "SELECT id, email, created_at FROM users ORDER BY created_at DESC"
      limit: 10
  - description: "Run a parameterized query and show results as a table with EXPLAIN"
    input:
      query: "SELECT * FROM orders WHERE user_id = $1 AND status = $2"
      params: ["user_123", "pending"]
      format: "table"
      explain: true
