name: project_security_secrets
version: "2.0.0"
description: |
  Scan files for hardcoded secrets, API keys, tokens, and other sensitive credentials.

category: security
tags:
  - security
  - secrets
  - credentials
  - scanning

mcp:
  server: project-engine
  method: project_security_secrets
  defer_loading: true

inputSchema:
  type: object
  properties:
    path:
      type: string
      description: "Directory or file path to scan. Defaults to project root."
    include_staged:
      type: boolean
      description: "Also scan git-staged files. Defaults to false."
    severity_threshold:
      type: string
      enum:
        - low
        - medium
        - high
      description: "Minimum severity level to report. Defaults to \"low\"."
    max_depth:
      type: number
      description: "Maximum directory depth to recurse. Auto-detected if not specified."
    check_presence_only:
      type: boolean
      description: "Only report whether secrets exist, without showing content. Defaults to false."
  required: []

examples:
  - description: "Scan the entire project for hardcoded secrets"
    input: {}
  - description: "Scan staged files for high-severity secrets before committing"
    input:
      include_staged: true
      severity_threshold: "high"
      check_presence_only: true
