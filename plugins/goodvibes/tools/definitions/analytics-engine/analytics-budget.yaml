name: analytics_budget
version: "1.0.0"
description: |
  Set, check, or clear a session budget (in dollars or tokens).
  When set, the mini dashboard shows remaining budget with
  color-coded thresholds.

mcp:
  server: analytics-engine
  method: analytics_budget
  defer_loading: true

input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["set", "check", "clear"]
      description: "Budget action to perform"
    amount:
      type: number
      minimum: 0
      exclusiveMinimum: true
      description: "Budget amount (required for 'set' action)"
    unit:
      type: string
      enum: ["dollars", "tokens"]
      description: "Budget unit"
      default: "dollars"
    warn_at:
      type: array
      items:
        type: number
        minimum: 0
        maximum: 1
      description: "Warning thresholds as fractions (e.g. [0.5, 0.8, 1.0])"
  required: ["action"]

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Set a $5 budget"
    input:
      action: "set"
      amount: 5
      unit: "dollars"
    output:
      content:
        - type: "text"
          text: "Budget set: $5.00 | Warnings at 50%, 80%, 100%"

  - description: "Check current budget"
    input:
      action: "check"
    output:
      content:
        - type: "text"
          text: "Budget: $3.21 / $5.00 remaining (on-track) [=========>  ] 64%"
