name: analytics_export
version: "1.0.0"
description: |
  Export session data in JSON, CSV, or markdown format.
  Can export current session, a specific historical session,
  or all historical data.

mcp:
  server: analytics-engine
  method: analytics_export
  defer_loading: true

input_schema:
  type: object
  properties:
    format:
      type: string
      enum: ["json", "csv", "markdown"]
      description: "Export format"
    scope:
      type: string
      pattern: "^(current|historical|session:[a-f0-9]+)$"
      description: "Which session(s) to export. 'current', 'historical', or 'session:<id>'"
      default: "current"
    sections:
      type: array
      items:
        type: string
        enum: ["tokens", "cache", "commands", "agents", "files", "cost", "timeline"]
      description: "Specific data sections to include (all if omitted)"
    output_path:
      type: string
      description: "File path to write export (returns content if omitted)"
  required: ["format"]

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Export current session as JSON"
    input:
      format: "json"
      scope: "current"
    output:
      content:
        - type: "text"
          text: "{\"session_id\": \"abc123\", \"tokens\": {\"input\": 125432, ...}}"

  - description: "Export cost data to file"
    input:
      format: "csv"
      sections: ["cost", "tokens"]
      output_path: "/tmp/session-export.csv"
    output:
      content:
        - type: "text"
          text: "Exported 2 sections to /tmp/session-export.csv (4.2 KB)"
