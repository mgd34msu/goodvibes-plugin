name: analytics_config
version: "1.0.0"
description: |
  View or update analytics engine settings like refresh rates,
  cost rates, webhook URLs, and anomaly detection.

mcp:
  server: analytics-engine
  method: analytics_config
  defer_loading: true

input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["get", "set"]
      description: "Get current config or set a value"
    key:
      type: string
      description: "Dot-notation config key (e.g. 'cost.inputRate', 'anomalyDetection.enabled')"
    value:
      description: "Value to set (required for 'set' action, any JSON-compatible type)"
  required: ["action"]

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Get all config"
    input:
      action: "get"
    output:
      content:
        - type: "text"
          text: "refreshIntervalMs: 2000\ncost.inputRate: 0.000003\ncost.outputRate: 0.000015\n..."

  - description: "Set a config value"
    input:
      action: "set"
      key: "cost.inputRate"
      value: 0.000004
    output:
      content:
        - type: "text"
          text: "Updated cost.inputRate: 0.000003 → 0.000004"
