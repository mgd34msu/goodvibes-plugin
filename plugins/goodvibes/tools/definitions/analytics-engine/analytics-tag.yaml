name: analytics_tag
version: "1.0.0"
description: |
  Add, remove, or list tags on the current session. Tags are persisted
  in the global SQLite DB and support multi-tag arrays. Use action=auto
  to get heuristic tag suggestions based on JSONL analysis.

mcp:
  server: analytics-engine
  method: analytics_tag
  defer_loading: true

input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["add", "remove", "list", "auto"]
      description: "Tag operation to perform"
    value:
      type: string
      minLength: 1
      maxLength: 100
      description: "Tag value (required for add/remove, optional for list/auto)"
    scope:
      type: string
      enum: ["session", "all"]
      default: "session"
      description: "Scope for list action (session or all tags)"
  required: ["action"]

output_schema:
  type: object
  properties:
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          text: { type: string }
    isError:
      type: boolean

examples:
  - description: "Add a tag to the current session"
    input:
      action: "add"
      value: "analytics-engine-rework"
    output:
      content:
        - type: "text"
          text: "Tag added: analytics-engine-rework"

  - description: "Remove a tag"
    input:
      action: "remove"
      value: "wip"
    output:
      content:
        - type: "text"
          text: "Tag removed: wip"

  - description: "List session tags"
    input:
      action: "list"
    output:
      content:
        - type: "text"
          text: "Session tags: analytics-engine-rework, phase-5"

  - description: "Auto-suggest tags from JSONL analysis"
    input:
      action: "auto"
    output:
      content:
        - type: "text"
          text: "Suggested tags: refactoring, analytics, tui"
