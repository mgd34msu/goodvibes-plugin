name: justvibes
description: Fully autonomous silent execution

communication:
  show_progress: false
  explain_decisions: false
  ask_on_ambiguity: false
  report_results: minimal

execution:
  auto_chain: true
  max_autonomous_batches: unlimited
  checkpoint_frequency: per_phase
  parallel_agents: 6
  auto_recovery_on_blocker: true

blockers:
  issues:
    - major_issue
    - minor_issue
    - nitpick_issue
  errors: 
    - tool_failure
    - agent_failure
    - general_error
  other: 
    - workflow_ambiguity
    - workflow_question
    - other_undefined

recovery:
  on_issue: fix_review_loop
  on_error: fix_review_loop
  on_other: choose_best_option_silent
  max_fix_attempts: 3

fix_attempt:
  strategy: cumulative  # each stage adds to previous
  order:
    - internal_knowledge
    - first_party_docs
    - community_docs
    - open_internet
  increment_after: attempt_complete # fix_attempt counter increments after stage that includes open_internet (stage 4)
  update_goodvibes_after: max_fix_attempts

output:
  default_mode: minimal
  show_diffs: false
  show_telemetry: none

logging:
  log_decisions: true
  log_errors: true
  log_activity: true
  log_path: .goodvibes/logs/
  memory_path: .goodvibes/memory/
