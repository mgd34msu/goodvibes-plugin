search_index:
  - name: fullstack-feature
    keywords: *ref_0
    path: orchestration/fullstack-feature
    description: >-
      Load PROACTIVELY when task involves building a complete feature across multiple layers. Use when user says "build
      a feature", "add user profiles", "create a dashboard", or any request spanning database, API, UI, and tests.
      Orchestrates multi-agent work sequentially: schema and migrations, API endpoints, UI components, tests, and
      review. The runtime engine handles WRFC chains automatically via <gv> directives. Handles dependency ordering and
      cross-layer type sharing.
  - name: task-orchestration
    keywords: *ref_1
    path: orchestration/task-orchestration
    description: >-
      Load PROACTIVELY when decomposing a user request into parallel agent work. Use when user says "build this",
      "implement this feature", or any request requiring multiple agents working concurrently. Guides task decomposition
      into parallelizable units, agent assignment with skill matching, dependency graph construction, and result
      aggregation. The runtime engine handles WRFC chain coordination automatically via <gv> directives.
  - name: ai-integration
    keywords: *ref_2
    path: outcome/ai-integration
    description: >-
      Load PROACTIVELY when task involves AI, LLM, or machine learning features. Use when user says "add AI chat",
      "implement streaming responses", "build a RAG pipeline", "add embeddings", or "integrate OpenAI". Covers chat
      interfaces, streaming with Vercel AI SDK, retrieval-augmented generation, vector search, embeddings pipelines,
      tool/function calling, and provider abstraction for OpenAI, Anthropic, and local models.
  - name: api-design
    keywords: *ref_3
    path: outcome/api-design
    description: >-
      Load PROACTIVELY when task involves building or modifying API endpoints. Use when user says "build an API", "add
      an endpoint", "create a REST route", "set up GraphQL", or "add tRPC procedures". Covers route design and file
      organization, request validation with Zod, response formatting, error handling patterns, middleware composition,
      authentication guards, rate limiting, pagination, and API documentation generation.
  - name: authentication
    keywords: *ref_4
    path: outcome/authentication
    description: >-
      Load PROACTIVELY when task involves user identity, login, or access control. Use when user says "add
      authentication", "set up login", "add OAuth", "protect these routes", "implement RBAC", or "add sign-up". Covers
      session management, JWT tokens, OAuth2 flows, password reset, email verification, protected route middleware,
      role-based access control, and security hardening (CSRF, rate limiting, token rotation).
  - name: component-architecture
    keywords: *ref_5
    path: outcome/component-architecture
    description: >-
      Load PROACTIVELY when task involves designing or building UI components. Use when user says "build a component",
      "create a form", "add a modal", "design the layout", or "refactor this page". Covers component composition and
      hierarchy, prop design and typing, render optimization (memo, useMemo, useCallback), compound component patterns,
      controlled vs uncontrolled forms, file organization, and accessibility for React, Vue, and Svelte.
  - name: database-layer
    keywords: *ref_6
    path: outcome/database-layer
    description: >-
      Load PROACTIVELY when task involves database design, schemas, or data access. Use when user says "set up the
      database", "create a schema", "add a migration", "write a query", or "set up Prisma". Covers schema design and
      normalization, ORM setup (Prisma, Drizzle), migration workflows, connection pooling, query optimization, indexing
      strategies, seeding, and transaction patterns for PostgreSQL, MySQL, SQLite, and MongoDB.
  - name: deployment
    keywords: *ref_7
    path: outcome/deployment
    description: >-
      Load PROACTIVELY when task involves deploying, hosting, or CI/CD pipelines. Use when user says "deploy this", "set
      up CI/CD", "add Docker", "configure Vercel", or "set up monitoring". Covers platform-specific deployment (Vercel,
      Railway, Fly.io, AWS), Dockerfile creation, environment variable management, CI/CD pipeline configuration (GitHub
      Actions), preview deployments, health checks, rollback strategies, and production monitoring setup.
  - name: payment-integration
    keywords: *ref_8
    path: outcome/payment-integration
    description: >-
      Load PROACTIVELY when task involves payments, billing, or subscriptions. Use when user says "add payments",
      "integrate Stripe", "set up subscriptions", "add a checkout flow", or "handle billing webhooks". Covers Stripe,
      LemonSqueezy, and Paddle integration, checkout sessions, subscription lifecycle management, webhook verification
      and handling, customer portal, metered billing, refunds, and PCI compliance considerations.
  - name: service-integration
    keywords: *ref_9
    path: outcome/service-integration
    description: >-
      Load PROACTIVELY when task involves connecting external services or third-party APIs. Use when user says "add
      email sending", "integrate a CMS", "set up file uploads", "add analytics", or "connect to S3". Covers email
      services (Resend, SendGrid), CMS platforms (Sanity, Contentful, Payload), file upload solutions (UploadThing,
      Cloudinary, S3), analytics integration, webhook handling, error recovery, and credential management.
  - name: state-management
    keywords: *ref_10
    path: outcome/state-management
    description: >-
      Load PROACTIVELY when task involves application state, data fetching, or form handling. Use when user says "manage
      state", "add data fetching", "set up Zustand", "handle form validation", or "add React Query". Covers server state
      (TanStack Query with caching, optimistic updates), client state (Zustand stores), form state (React Hook Form with
      Zod validation), URL state (search params, routing), and choosing between state solutions.
  - name: styling-system
    keywords: *ref_11
    path: outcome/styling-system
    description: >-
      Load PROACTIVELY when task involves CSS architecture, theming, or visual design systems. Use when user says "set
      up Tailwind", "add dark mode", "create a design system", "make it responsive", or "configure the theme". Covers
      Tailwind configuration and custom plugins, design token systems, responsive breakpoint strategies, dark mode
      implementation, component variant patterns (CVA/class-variance-authority), CSS-in-JS alternatives, and animation
      patterns.
  - name: testing-strategy
    keywords: *ref_12
    path: outcome/testing-strategy
    description: >-
      Load PROACTIVELY when task involves writing tests, improving coverage, or test infrastructure. Use when user says
      "add tests", "write unit tests", "set up E2E testing", "improve coverage", or "add mocks". Covers Vitest/Jest unit
      tests, React Testing Library component tests, Playwright E2E tests, MSW API mocking, test organization and naming,
      fixture management, coverage targets and thresholds, snapshot testing, and CI integration.
  - name: error-recovery
    keywords: *ref_13
    path: protocol/error-recovery
    description: >-
      ALWAYS load before starting any task. Defines systematic recovery procedures when things go wrong during
      execution. Covers tool failures, build errors, test failures, type errors, and unexpected runtime results.
      Includes tiered escalation (retry, fallback, memory-informed diagnosis, orchestrator escalation) and post-recovery
      logging to prevent recurrence.
  - name: gather-plan-apply
    keywords: *ref_14
    path: protocol/gather-plan-apply
    description: >-
      MANDATORY before starting any task. Enforces the GPA execution loop that prevents tool call sprawl. G: GATHER
      phase combines discover queries + memory reads + file reads into one phase. P: Plan in text with zero tool calls.
      A: APPLY all writes/edits/verification in one phase. One call per tool type per phase — batch all same-type
      operations together. Covers dependency analysis, batch opportunities, scope estimation, and loop-back triggers.
  - name: goodvibes-memory
    keywords: *ref_15
    path: protocol/goodvibes-memory
    description: >-
      ALWAYS load before starting any task. Provides persistent cross-session memory for learning from past work. Read
      memory at task start to avoid repeating mistakes; write memory at task end to record what worked. Covers
      decisions.json (architectural choices), patterns.json (proven approaches), failures.json (past errors and fixes),
      preferences.json (project conventions), and session activity logs.
  - name: precision-mastery
    keywords: *ref_16
    path: protocol/precision-mastery
    description: >-
      ALWAYS load before starting any task. Maximizes token efficiency for all file operations, searches, and command
      execution. Covers extract modes (content, outline, symbols, ast, lines), verbosity tuning, multi-file batching,
      and discover tool orchestration. Ensures agents spend tokens on outcomes, not overhead.
  - name: review-scoring
    keywords: *ref_17
    path: protocol/review-scoring
    description: >-
      ALWAYS load before starting any task. Provides the 10-dimension weighted scoring rubric (0-10 scale) used to
      evaluate all implementations in WRFC loops. Dimensions include correctness, completeness, error handling, type
      safety, security, performance, maintainability, testing, accessibility, and documentation. Includes deterministic
      validation scripts and score thresholds for pass/revise/reject decisions.
