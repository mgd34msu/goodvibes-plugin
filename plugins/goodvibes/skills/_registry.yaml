      - name: gather-plan-apply
        path: protocol/gather-plan-apply
        description: >-
          MANDATORY before starting any task. Enforces the GPA execution loop that prevents tool call sprawl. G: GATHER
          phase combines discover queries + memory reads + file reads into one phase. P: Plan in text with zero tool
          calls. A: APPLY all writes/edits/verification in one phase. One call per tool type per phase — batch all
          same-type operations together. Covers dependency analysis, batch opportunities, scope estimation, and
          loop-back triggers.
