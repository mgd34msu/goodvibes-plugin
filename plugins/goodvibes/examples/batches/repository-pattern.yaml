# Example Batch: Codebase Refactor
# Refactors direct database calls to use repository pattern
#
# This batch demonstrates:
# - Large-scale refactoring across multiple files
# - Multi-agent coordination (architect + engineer + reviewer)
# - Pattern detection and validation
# - Comprehensive testing after refactor
# - Ensuring no direct database calls remain

metadata:
  name: repository-pattern-refactor
  description: Refactor direct database calls to repository pattern
  author: goodvibes
  version: 1.0.0
  tags: [refactor, architecture, database]

operations:

  # ============================================================
  # PHASE 1: DISCOVERY & ANALYSIS
  # Find all direct database access points
  # ============================================================

  read:
    # Find all direct Prisma client usage
    - id: find-prisma-calls
      type: search
      pattern: "prisma\\.(\\w+)\\.(findMany|findUnique|findFirst|create|update|delete|upsert|count)"
      glob: "src/**/*.{ts,tsx}"
      output:
        mode: content
        context:
          before: 5
          after: 5

    # Find database client imports
    - id: find-db-imports
      type: search
      pattern: "import.*prisma|from.*@prisma/client"
      glob: "src/**/*.ts"
      output:
        mode: files_only

    # Analyze current project structure
    - id: analyze-structure
      type: files
      targets: ["src/"]
      extract: outline
      options:
        depth: 3

    # Look for existing repository patterns (if any)
    - id: find-existing-repos
      type: search
      pattern: "(class|interface).*Repository"
      glob: "src/**/*.ts"
      output:
        mode: content

    # Check database schema
    - id: get-db-schema
      type: analyze
      kind: database_schema
      options:
        include_relations: true

  # ============================================================
  # PHASE 2-5: EXECUTION PHASE
  # Architecture, implementation, review, and validation
  # ============================================================

  exec:
    # ============================================================
    # Architecture design
    # ============================================================

    # Architect designs the repository pattern
    - id: design-repositories
      type: agent
      agent: goodvibes:architect
      task: |
        Design a repository pattern implementation for this codebase.

        **Analysis required:**
        1. Review all direct database access points found
        2. Identify distinct data models and their operations
        3. Group related operations into logical repositories
        4. Design repository interfaces with proper abstractions

        **Deliverables:**
        1. Repository interface definitions (IUserRepository, IPostRepository, etc.)
        2. Folder structure for repositories
        3. Migration strategy (which files to change in what order)
        4. List of common patterns to extract (pagination, filtering, sorting)

        **Design principles:**
        - Single Responsibility: One repository per domain entity
        - Dependency Inversion: Code depends on interfaces, not implementations
        - Don't leak database details through repository interface
        - Include proper error handling in repository layer
        - Support transactions for multi-operation workflows

        **Output format:**
        Provide a detailed plan as markdown with:
        - Repository list with responsibilities
        - Interface signatures for each repository
        - Directory structure
        - Migration steps in dependency order

      depends_on:
        - find-prisma-calls
        - find-db-imports
        - analyze-structure
        - find-existing-repos
        - get-db-schema

      inject:
        db_calls: "{{find-prisma-calls.results}}"
        imports: "{{find-db-imports.files}}"
        structure: "{{analyze-structure.outline}}"
        existing: "{{find-existing-repos.results}}"
        schema: "{{get-db-schema.schema}}"

      config:
        timeout_ms: 600000
        max_turns: 30

    # ============================================================
    # Repository implementation
    # ============================================================

    # Engineer implements the repositories
    - id: implement-repositories
      type: agent
      agent: goodvibes:engineer
      task: |
        Implement the repository pattern as designed.

        **Step 1: Create base infrastructure**
        - Create base repository interface/class
        - Create repository factory/container
        - Set up dependency injection if needed

        **Step 2: Implement each repository**
        For each repository in the design:
        - Create repository interface (src/repositories/interfaces/)
        - Create repository implementation (src/repositories/)
        - Include proper error handling
        - Add JSDoc documentation
        - Export from index.ts

        **Step 3: Migrate callers**
        - Update each file that makes direct DB calls
        - Inject repository instead of Prisma client
        - Update imports
        - Preserve existing behavior

        **Requirements:**
        - Full TypeScript types, no 'any'
        - Proper error handling with custom error types
        - Support transactions where needed
        - Include pagination/filtering helpers
        - Follow existing code style

        **DO NOT:**
        - Leave any direct Prisma calls outside repositories
        - Break existing functionality
        - Skip error handling

      depends_on:
        - design-repositories

      inject:
        architecture_plan: "{{design-repositories.outputs.plan}}"
        db_calls: "{{find-prisma-calls.results}}"

      config:
        timeout_ms: 900000  # 15 minutes
        max_turns: 100

    # ============================================================
    # Code review
    # ============================================================

    # Reviewer checks the implementation
    - id: review-refactor
      type: agent
      agent: goodvibes:reviewer
      task: |
        Review the repository pattern refactoring for:

        **Completeness:**
        - Are all direct database calls migrated?
        - Does each repository cover all necessary operations?
        - Are all edge cases handled?

        **Code Quality:**
        - Proper TypeScript types
        - Error handling
        - Documentation
        - Consistent naming
        - No code duplication

        **Architecture:**
        - Does it follow the planned design?
        - Are abstractions appropriate?
        - Is dependency injection working?
        - Can repositories be easily tested?

        **Provide:**
        - List of issues found (if any)
        - Suggestions for improvement
        - Approval status (approved/needs-changes)

      depends_on:
        - implement-repositories

      config:
        timeout_ms: 300000
        max_turns: 20

    # ============================================================
    # Validation commands
    # ============================================================

    # Run TypeScript compiler
    - id: typecheck
      type: command
      commands:
        - cmd: "npm run typecheck"
          expect:
            exit_code: 0
            stderr_empty: true
      depends_on:
        - implement-repositories

    # Run linter
    - id: lint
      type: command
      commands:
        - cmd: "npm run lint"
          expect:
            exit_code: 0
      depends_on:
        - implement-repositories

    # Run all tests
    - id: run-tests
      type: command
      commands:
        - cmd: "npm run test"
          expect:
            exit_code: 0
            stdout_contains: "All tests passed"
      depends_on:
        - typecheck
      config:
        timeout_ms: 600000  # 10 minutes for tests

    # Build project
    - id: build
      type: command
      commands:
        - cmd: "npm run build"
          expect:
            exit_code: 0
      depends_on:
        - run-tests
      config:
        timeout_ms: 300000

  # ============================================================
  # PHASE 6: QUERY OPERATIONS
  # Validation and state tracking
  # ============================================================

  query:
    # ============================================================
    # Validation queries
    # ============================================================

    # Verify no direct Prisma calls outside repositories
    - id: verify-no-direct-db
      type: search
      pattern: "prisma\\.(\\w+)\\.(findMany|findUnique|create|update|delete)"
      glob: "src/**/*.ts"
      exclude: ["src/repositories/**"]
      output:
        mode: count

      # This should return 0 results
      validation:
        expect:
          count: 0
        on_fail:
          action: error
          message: "Found direct database calls outside repository layer"

      depends_on:
        - implement-repositories

    # ============================================================
    # State tracking
    # ============================================================

    - id: track-pattern-decision
      type: state_write
      operation: track
      entries:
        - kind: pattern
          data:
            pattern: "Repository Pattern"
            description: "Abstraction layer between business logic and data access"
            location: "src/repositories/"
            benefits:
              - "Testability: Easy to mock repositories in tests"
              - "Maintainability: Database logic isolated in one place"
              - "Flexibility: Can swap database implementations"
            usage: "Inject repositories via dependency injection"
            examples:
              - "src/repositories/UserRepository.ts"
              - "src/repositories/PostRepository.ts"

        - kind: decision
          data:
            what: "Refactored to repository pattern"
            why: "Improves testability, separates concerns, enables easier database migrations"
            impact: "All data access now goes through repository layer"
            category: architecture
            confidence: high

      depends_on:
        - build

# ============================================================
# TRANSACTION CONFIGURATION
# ============================================================

transaction:
  mode: atomic

  checkpoints:
    - after: design-repositories
      name: design-complete
    - after: implement-repositories
      name: implementation-complete
    - after: review-refactor
      name: review-complete
    - after: verify-no-direct-db
      name: validation-complete

# ============================================================
# VALIDATION CONFIGURATION
# ============================================================

validation:
  # Validate after completion
  after:
    - typecheck
    - lint
    - test:
        coverage_threshold: 80

  # Custom validation rules
  rules:
    - name: no-direct-db-access
      pattern: "prisma\\.(\\w+)\\."
      exclude: ["**/repositories/**"]
      severity: error
      message: "Direct database access outside repository layer"

    - name: repository-naming
      pattern: "class \\w+Repository"
      location: "src/repositories/"
      severity: error
      message: "Repositories must be in src/repositories/"

# ============================================================
# RECOVERY CONFIGURATION
# ============================================================

recovery:
  checkpoint: true
  rollback_on_fail: true

  retry:
    max_attempts: 2
    backoff: linear
    initial_delay_ms: 2000

  on_fail:
    - action: create_report
      output: ".goodvibes/logs/refactor-failure.md"
    - action: notify
      level: error
      message: "Repository pattern refactor failed"

# ============================================================
# OUTPUT CONFIGURATION
# ============================================================

output:
  mode: standard
  show_diffs: true
  include_reasoning: true

  report:
    format: markdown
    output: ".goodvibes/logs/repository-refactor-report.md"
    sections:
      - summary
      - changes
      - validation_results
      - metrics
      - recommendations
