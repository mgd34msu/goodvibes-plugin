# Logging configuration in TOML format

[general]
level = "info"
format = "json"
timestamp = true

[console]
enabled = true
color = true
pretty_print = false

[file]
enabled = true
path = "logs/app.log"
max_size = "100MB"
max_age = 7
max_backups = 5
compress = true

[transports]
[transports.http]
enabled = false
url = "https://logs.example.com/ingest"
headers = { "Authorization" = "Bearer token" }

[transports.syslog]
enabled = false
host = "localhost"
port = 514
protocol = "udp"

[filters]
[filters.errors]
level = "error"
output = "logs/errors.log"

[filters.performance]
pattern = "performance\\."
output = "logs/performance.log"
