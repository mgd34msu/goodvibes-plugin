# Database configuration
database:
  host: localhost
  port: 5432
  name: stress_db
  username: postgres
  password: postgres
  ssl: false
  pool:
    min: 2
    max: 10
    idle_timeout: 30000
  options:
    statement_timeout: 30000
    query_timeout: 30000
    application_name: stress-project

# Replica configuration
replicas:
  - host: replica1.example.com
    port: 5432
    priority: 1
  - host: replica2.example.com
    port: 5432
    priority: 2

# Migration settings
migrations:
  directory: ./migrations
  table_name: schema_migrations
  auto_run: false
